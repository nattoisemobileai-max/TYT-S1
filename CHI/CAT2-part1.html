<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT2 甲部> 成語40個</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #EFF6FF;
      background-image: radial-gradient(#BFDBFE 2.5px, transparent 2.5px);
      background-size: 22px 22px;
      color: #1E293B;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    .comic-card {
      background: #FFFFFF;
      border: 2.5px solid #1E293B;
      box-shadow: 4px 4px 0px #1E293B;
    }
    .comic-pill {
      border: 2px solid #1E293B;
      box-shadow: 2.5px 2.5px 0px #1E293B;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .comic-pill:active {
      transform: translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    @keyframes charPop {
      0% { opacity: 0; transform: scale(0.6) rotate(-6deg); }
      70% { opacity: 1; transform: scale(1.06) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) rotate(var(--tilt, 0deg)); }
    }
    .char-pop {
      animation: charPop 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }
    .red-circle-stroke {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: drawCircle 0.75s ease-out forwards;
    }
    .speaking-circle {
      box-shadow: 0 0 0 4px #2563EB, 4px 4px 0px #1E293B !important;
      border-color: #2563EB !important;
      transition: all 0.25s ease;
    }
    .wavy-idiom {
      text-decoration: underline wavy #2563EB 2px;
      text-underline-offset: 4px;
      font-weight: 800;
      color: #B91C1C;
    }
    .marker-highlight {
      background-image: linear-gradient(120deg, #FDE68A 0%, #FCD34D 100%);
      background-repeat: no-repeat;
      background-position: 0 85%;
      background-size: 100% 42%;
      padding: 0 3px;
      border-radius: 3px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #FEF3C7; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation Header (Auto-minimizes on scroll down) -->
  <header id="top-header" class="sticky top-0 z-30 bg-[#EFF6FF]/95 backdrop-blur-sm border-b-2 border-[#1E293B] transition-all duration-200">
    <div id="header-inner" class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 space-y-2">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <!-- Brand Logo -->
        <div class="flex items-center gap-2.5">
          <a href="CAT2-index.html" title="返回主頁" class="block hover:scale-105 transition-transform cursor-pointer">
            <div id="header-logo" class="w-11 h-11 rounded-2xl bg-[#DBEAFE] flex items-center justify-center border-2 border-[#1E293B] shadow-[2.5px_2.5px_0px_#1E293B] -rotate-3 transition-all shrink-0">
            <svg viewBox="0 0 64 64" class="w-9 h-9" aria-hidden="true">
              <polygon points="11,26 15,7 28,19" fill="#F97316" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="53,26 49,7 36,19" fill="#F97316" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="32" cy="37" rx="22" ry="18" fill="#FDBA74" stroke="#1E293B" stroke-width="3"/>
              <rect x="11" y="22" width="42" height="7" rx="3" fill="#2563EB" stroke="#1E293B" stroke-width="2.5"/>
              <path d="M18,33 L26,35" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M46,33 L38,35" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="23" cy="38" r="3" fill="#1E293B"/>
              <circle cx="41" cy="38" r="3" fill="#1E293B"/>
              <polygon points="30,40 34,40 32,43" fill="#1E293B"/>
              <path d="M26,46 Q32,50 39,45" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="8" y1="38" x2="17" y2="39" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="43" x2="17" y2="43" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
              <line x1="47" y1="39" x2="56" y2="38" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
              <line x1="47" y1="43" x2="56" y2="43" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          </a>
          <div>
            <h1 class="font-serif-tc text-lg sm:text-xl font-black text-[#1E293B] leading-tight">CAT2 甲部> 成語40個</h1>
            <p id="header-subtitle" class="text-[11px] font-medium text-slate-600">40 個核心成語 · 紅圈正字 · 廣東話朗讀 · 複句造句</p>
          </div>
        </div>

        <!-- Student Name + Collapse Toggle -->
        <div class="flex items-center gap-2">
          <div id="student-name-wrap" class="hidden sm:flex items-center gap-1.5 text-xs font-bold text-[#1E293B]">
            <span>我的名字</span>
            <input id="student-name" type="text" placeholder="例如：陳小晴" class="w-28 px-3 py-1 rounded-full bg-white border-2 border-[#1E293B] text-xs font-semibold focus:outline-none focus:bg-amber-50" />
          </div>
          <button id="toggle-menu-btn" type="button" class="px-3 py-1 rounded-full bg-white hover:bg-slate-100 border-2 border-[#1E293B] text-xs font-bold text-[#1E293B] transition">
            ▲ 收合選單
          </button>
        </div>
      </div>

      <!-- Collapsible Group Tags Row -->
      <div id="header-collapsible" class="flex flex-wrap items-center justify-between gap-2 pt-1">
        <div class="flex flex-wrap gap-2" id="group-tabs">
          <button type="button" data-grp="all" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#2563EB] text-white">全部 (40)</button>
          <button type="button" data-grp="p14_15" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-white text-[#1E293B] hover:bg-amber-50">P14-15</button>
          <button type="button" data-grp="p16_17" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-white text-[#1E293B] hover:bg-amber-50">P16-17</button>
          <button type="button" data-grp="p18_19" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-white text-[#1E293B] hover:bg-amber-50">P18-19</button>
          <button type="button" data-grp="p20_21" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-white text-[#1E293B] hover:bg-amber-50">P20-21</button>
          <button type="button" data-grp="p22_23" class="grp-btn comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-white text-[#1E293B] hover:bg-amber-50">P22-23</button>
          <button type="button" id="slideshow-tag-btn" class="comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#FCD34D] text-[#1E293B] hover:bg-amber-300">🎬 40成語大字連播</button>
          <button type="button" id="games-tag-btn" class="comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-emerald-400 text-[#1E293B] hover:bg-emerald-300">🎮 遊戲區</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 py-5">

    <!-- MODE B: 40成語大字連播 (Hidden by default) -->
    <section id="slideshow-panel" class="hidden comic-card rounded-3xl p-5 sm:p-9 space-y-6 text-center">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-200 pb-3">
        <div class="flex items-center gap-2">
          <span id="ss-counter" class="text-xs sm:text-sm font-bold px-3.5 py-1 rounded-full bg-[#1E293B] text-white">第 1 / 40 個</span>
          <span id="ss-page" class="text-xs sm:text-sm font-bold px-3 py-1 rounded-full bg-[#FCD34D] border-2 border-[#1E293B] text-[#1E293B]">P.14</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <label class="inline-flex items-center gap-1 text-xs font-bold bg-amber-50 border-2 border-[#1E293B] px-2.5 py-1 rounded-full">
            <span>讀完停頓：</span>
            <select id="ss-delay-select" aria-label="每個成語讀完停頓時間" class="bg-transparent font-black text-[#2563EB] focus:outline-none">
              <option value="1000">1 秒</option>
              <option value="3000" selected>3 秒</option>
              <option value="5000">5 秒</option>
            </select>
          </label>
          <label class="inline-flex items-center gap-1 text-xs font-bold bg-amber-50 border-2 border-[#1E293B] px-2.5 py-1 rounded-full cursor-pointer">
            <input id="ss-loop-cb" type="checkbox" class="accent-[#2563EB]" />
            <span>播完循環</span>
          </label>
          <span id="ss-status" class="text-xs font-bold text-slate-600">準備就緒｜點擊播放逐個朗讀</span>
        </div>
      </div>

      <div id="ss-chars" class="grid grid-cols-4 gap-2.5 sm:gap-5 max-w-4xl mx-auto py-4 items-end"></div>
      <div id="ss-typo-note" class="hidden max-w-xl mx-auto"></div>
      <p id="ss-meaning" class="text-base sm:text-xl font-bold text-slate-700 max-w-2xl mx-auto leading-relaxed"></p>

      <div class="flex flex-wrap items-center justify-center gap-2.5 pt-3 border-t-2 border-slate-200">
        <button id="ss-prev-btn" type="button" class="comic-pill px-4 py-2 rounded-full bg-white hover:bg-slate-100 text-sm font-bold">← 上一個</button>
        <button id="ss-play-btn" type="button" class="comic-pill px-6 py-2 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-sm sm:text-base font-bold">▶ 全部自動播</button>
        <button id="ss-pause-btn" type="button" class="comic-pill px-5 py-2 rounded-full bg-[#FCD34D] hover:bg-amber-300 text-[#1E293B] text-sm sm:text-base font-bold">⏸ Pause 暫停</button>
        <button id="ss-stop-btn" type="button" class="comic-pill px-5 py-2 rounded-full bg-[#1E293B] hover:bg-slate-700 text-white text-sm sm:text-base font-bold">⏹ Stop 停止</button>
        <button id="ss-next-btn" type="button" class="comic-pill px-4 py-2 rounded-full bg-white hover:bg-slate-100 text-sm font-bold">下一個 →</button>
      </div>
    </section>

    <!-- MODE C: GAME ZONE (🧩 成語配對, 🖼️ 看圖猜成語, ✏️ 填字挑戰, ⏱️ 限時挑戰) -->
    <section id="games-panel" class="hidden space-y-5">
      <!-- Game Hub -->
      <div id="game-hub" class="comic-card rounded-3xl p-5 sm:p-8 space-y-5 text-center">
        <div class="space-y-1">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#DBEAFE] border-2 border-[#1E293B] shadow-[3px_3px_0px_#1E293B] mx-auto mb-1">
            <svg viewBox="0 0 64 64" class="w-12 h-12" aria-hidden="true">
              <polygon points="11,26 15,7 28,19" fill="#F97316" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="53,26 49,7 36,19" fill="#F97316" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="32" cy="37" rx="22" ry="18" fill="#FDBA74" stroke="#1E293B" stroke-width="3"/>
              <rect x="13" y="29" width="16" height="10" rx="3" fill="#1E293B"/>
              <rect x="35" y="29" width="16" height="10" rx="3" fill="#1E293B"/>
              <line x1="29" y1="33" x2="35" y2="33" stroke="#1E293B" stroke-width="3"/>
              <line x1="16" y1="32" x2="21" y2="32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
              <line x1="38" y1="32" x2="43" y2="32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
              <polygon points="30,42 34,42 32,45" fill="#1E293B"/>
              <path d="M26,47 Q32,51 39,46" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="font-serif-tc text-2xl font-black text-[#1E293B]">🐾 貓咪成語遊戲區</h2>
          <p class="text-sm font-bold text-slate-600">玩遊戲，溫成語！答得好就有星星 ⭐。最佳成績會記錄在這部裝置上。</p>
        </div>

        <div class="grid sm:grid-cols-2 gap-4 text-left">
          <button type="button" data-game="match" class="game-launch-btn comic-card rounded-2xl p-5 hover:bg-amber-50 transition flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="text-lg font-black text-[#1E293B]">🧩 成語配對</div>
              <p class="text-xs sm:text-sm text-slate-600 font-medium">共 3 輪，每輪將 5 個成語配對正確解釋</p>
            </div>
            <span id="best-match" class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B]">最佳: --</span>
          </button>

          <button type="button" data-game="pic" class="game-launch-btn comic-card rounded-2xl p-5 hover:bg-amber-50 transition flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="text-lg font-black text-[#1E293B]">🖼️ 看圖猜成語</div>
              <p class="text-xs sm:text-sm text-slate-600 font-medium">共 10 題，根據情境圖片選出正確成語</p>
            </div>
            <span id="best-pic" class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B]">最佳: --</span>
          </button>

          <button type="button" data-game="fill" class="game-launch-btn comic-card rounded-2xl p-5 hover:bg-amber-50 transition flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="text-lg font-black text-[#1E293B]">✏️ 填字挑戰（正字）</div>
              <p class="text-xs sm:text-sm text-slate-600 font-medium">涵蓋全部正字題，選項必含課本易錯別字</p>
            </div>
            <span id="best-fill" class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B]">最佳: --</span>
          </button>

          <button type="button" data-game="timed" class="game-launch-btn comic-card rounded-2xl p-5 hover:bg-amber-50 transition flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="text-lg font-black text-[#1E293B]">⏱️ 限時挑戰（60秒）</div>
              <p class="text-xs sm:text-sm text-slate-600 font-medium">60 秒內根據意思搶答最多正確成語</p>
            </div>
            <span id="best-timed" class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B]">最佳: --</span>
          </button>
        </div>
      </div>

      <!-- Active Game Stage -->
      <div id="game-stage" class="hidden comic-card rounded-3xl p-5 sm:p-7 space-y-5 max-w-3xl mx-auto">
        <div class="flex items-center justify-between gap-2 border-b-2 border-slate-200 pb-3">
          <button id="back-to-hub-btn" type="button" class="comic-pill px-3.5 py-1.5 rounded-full bg-slate-200 hover:bg-slate-300 text-xs sm:text-sm font-bold text-[#1E293B]">
            ← 遊戲區
          </button>
          <div id="game-title" class="font-serif-tc text-lg sm:text-xl font-black text-[#1E293B]"></div>
        </div>
        <div id="game-content" class="space-y-4"></div>
      </div>
    </section>

    <!-- MODE A: TWO-COLUMN COMIC TEMPLATE (Matches IMG_5123.jpeg) -->
    <div id="detail-panel" class="grid lg:grid-cols-12 gap-5 items-start">

      <!-- LEFT SIDEBAR: 成語目錄 -->
      <aside class="lg:col-span-3 comic-card rounded-3xl p-4 space-y-3 lg:sticky lg:top-28">
        <div class="text-center">
          <span class="inline-block px-5 py-1 rounded-full bg-[#2563EB] text-white font-bold text-sm border-2 border-[#1E293B]">🐱 成語目錄</span>
        </div>

        <!-- Progress Bar -->
        <div class="space-y-1">
          <div class="flex items-center justify-between text-xs font-bold text-slate-600">
            <span id="completed-label">已完成 0 / 40</span>
            <span id="current-pos-label" class="text-[#2563EB]">1 / 40</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full border border-[#1E293B] overflow-hidden">
            <div id="completed-bar" class="h-full bg-[#2563EB] transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Search Input -->
        <input id="search-idiom" type="text" placeholder="搜尋成語……"
          class="w-full px-3.5 py-2 rounded-full bg-[#F1F5F9] border-2 border-[#1E293B] text-xs sm:text-sm font-medium focus:outline-none focus:bg-white" />

        <!-- Scrollable Idiom List -->
        <div id="sidebar-list" class="space-y-2 max-h-[360px] lg:max-h-[480px] overflow-y-auto pr-1"></div>
      </aside>

      <!-- RIGHT MAIN STAGE -->
      <div class="lg:col-span-9 space-y-4">

        <!-- CARD 1: TOP IDIOM TILES + MEANING -->
        <section id="hero-card" class="comic-card rounded-3xl p-4 sm:p-6">
          <div class="grid md:grid-cols-12 gap-4 items-center">
            <!-- Left: 4 Coral-Red Tilted Tiles + Red Typo Circle -->
            <div class="md:col-span-6 space-y-2">
              <div id="chars-stage" class="grid grid-cols-4 gap-2 sm:gap-2.5 items-end"></div>
              <div id="typo-banner" class="hidden text-center text-xs font-bold text-red-700 bg-red-50 border border-red-300 rounded-xl px-2.5 py-1.5"></div>
            </div>

            <!-- Right: Meaning & Usage -->
            <div id="meaning-usage-wrap" class="md:col-span-6 md:border-l-2 md:border-slate-200 md:pl-5 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-slate-500">意思</span>
                <div class="flex items-center gap-1.5" id="usage-box"></div>
              </div>
              <p id="meaning-box" class="text-lg sm:text-xl font-bold text-[#1E293B] leading-relaxed p-1 rounded-xl transition-all"></p>
              <div class="flex items-center justify-between pt-1">
                <span id="page-tag" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 border border-[#1E293B]">P.14</span>
                <div class="flex items-center gap-1.5">
                  <button id="mark-done-btn" type="button" class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border border-[#1E293B] transition">
                    ☆ 標記已學
                  </button>
                  <button id="prev-idiom-btn" type="button" class="text-xs font-bold px-2.5 py-1 rounded-full bg-white hover:bg-slate-100 border border-[#1E293B]">←</button>
                  <button id="next-idiom-btn" type="button" class="text-xs font-bold px-2.5 py-1 rounded-full bg-white hover:bg-slate-100 border border-[#1E293B]">→</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- CARD 2: MIDDLE SPLIT CARD (Audio Controls + Collocations | Illustration) -->
        <section class="comic-card rounded-3xl overflow-hidden">
          <div class="grid md:grid-cols-12">
            <!-- Left Half: Play Audio, Speed, 辨義, 近義詞, 反義詞 -->
            <div class="md:col-span-6 p-4 sm:p-5 space-y-3.5 flex flex-col justify-between">
              <div class="space-y-3">
                <!-- Audio Controls Bar (Matches IMG_5123.jpeg) -->
                <div class="flex flex-wrap items-center gap-2">
                  <button id="speak-btn" type="button" class="comic-pill px-3.5 py-1.5 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-xs sm:text-sm font-bold flex items-center gap-1">
                    🔊 廣東話讀全部
                  </button>
                  <button id="pause-speak-btn" type="button" class="hidden comic-pill px-3 py-1.5 rounded-full bg-[#FCD34D] text-[#1E293B] text-xs font-bold">
                    ⏸ 暫停
                  </button>
                  <button id="stop-speak-btn" type="button" class="hidden comic-pill px-3 py-1.5 rounded-full bg-[#1E293B] text-white text-xs font-bold">
                    ⏹ 停止
                  </button>
                  <div class="flex items-center gap-1 ml-auto text-xs font-bold">
                    <span class="text-slate-500">語速</span>

    let filteredList = [...IDIOMS];
    let currentIndex = 0;
    let speechRate = 0.95;
    let completedSet = new Set();
    try {
      completedSet = new Set(JSON.parse(localStorage.getItem('idiom_garden_done') || '[]'));

      try {
        localStorage.setItem('idiom_garden_done', JSON.stringify([...completedSet]));

    }

    // ==================== CANTONESE TTS ====================
    let isSpeechPaused = false;
    let speechQueue = [];
    let speechQueueIdx = 0;
    let speechSessionId = 0;
    let cachedVoices = [];
    window.__activeUtterance = null;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      cachedVoices = window.speechSynthesis.getVoices() || [];
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickBestChineseVoice() {
      const voices = cachedVoices.length ? cachedVoices : (window.speechSynthesis.getVoices() || []);
      return (
        voices.find(v => /zh[-_]HK/i.test(v.lang) && /cantonese|粵|sinji|hiu|wan|ting/i.test(v.name)) ||
        voices.find(v => /zh[-_]HK|yue/i.test(v.lang)) ||
        voices.find(v => /cantonese|廣東話|粵語/i.test(v.name)) ||
        voices.find(v => /zh[-_]TW|zh[-_]CN|^zh/i.test(v.lang)) ||
        null
      );
    }

    function clearSpeakingSection() {
      document.querySelectorAll('.speaking-circle').forEach(el => el.classList.remove('speaking-circle'));
    }

    function highlightSpeakingSection(targetId) {
      clearSpeakingSection();
      if (!targetId) return;
      const el = document.getElementById(targetId);
      if (el) {
        el.classList.add('speaking-circle');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function resetSpeechControls() {
      clearSpeakingSection();
      isSpeechPaused = false;
      speechQueue = [];
      speechQueueIdx = 0;
      window.__activeUtterance = null;
      document.getElementById('pause-speak-btn').classList.add('hidden');
      document.getElementById('stop-speak-btn').classList.add('hidden');
      document.getElementById('pause-speak-btn').textContent = '⏸ 暫停';
    }

    function stopSpeech() {
      speechSessionId++;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      resetSpeechControls();
    }

    function speakNextChunk(sessionId) {
      if (sessionId !== speechSessionId || isSpeechPaused) return;
      if (speechQueueIdx >= speechQueue.length) {
        resetSpeechControls();
        return;
      }
      const chunk = speechQueue[speechQueueIdx];
      highlightSpeakingSection(chunk.targetId);
      const u = new SpeechSynthesisUtterance(chunk.text);
      const best = pickBestChineseVoice();
      if (best) { u.voice = best; u.lang = best.lang; }
      else { u.lang = 'zh-HK'; }
      u.rate = speechRate;
      u.volume = 1.0;
      window.__activeUtterance = u;

      u.onend = () => {
        if (sessionId !== speechSessionId || isSpeechPaused) return;
        speechQueueIdx++;
        speakNextChunk(sessionId);
      };
      u.onerror = () => {
        if (sessionId !== speechSessionId) return;
        resetSpeechControls();
      };
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    }

    function playQueue(queue) {
      if (!('speechSynthesis' in window)) return;
      const wasActive = window.speechSynthesis.speaking || window.speechSynthesis.pending || window.speechSynthesis.paused;
      speechSessionId++;
      const mySession = speechSessionId;
      window.speechSynthesis.cancel();
      isSpeechPaused = false;
      speechQueue = queue;
      speechQueueIdx = 0;

      const pauseBtn = document.getElementById('pause-speak-btn');
      const stopBtn = document.getElementById('stop-speak-btn');
      pauseBtn.textContent = '⏸ 暫停';
      pauseBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');

      setTimeout(() => speakNextChunk(mySession), wasActive ? 90 : 20);
    }

    function speakAndAdvanceSlideshow(mySession) {
      if (mySession !== ssSessionId || ssState !== 'playing') return;
      renderSlideshowCard();
      const item = IDIOMS[ssIdx];
      const advanceNext = () => {
        if (mySession !== ssSessionId || ssState !== 'playing') return;
        const delayMs = parseInt(document.getElementById('ss-delay-select').value, 10) || 3000;
        let remainSec = Math.ceil(delayMs / 1000);
        const statusEl = document.getElementById('ss-status');
        statusEl.textContent = `⏳ 停頓 ${remainSec} 秒後切換下一個…`;
        const tickId = setInterval(() => {
          if (mySession !== ssSessionId || ssState !== 'playing') { clearInterval(tickId); return; }
          remainSec--;
          if (remainSec > 0) statusEl.textContent = `⏳ 停頓 ${remainSec} 秒後切換下一個…`;
          else clearInterval(tickId);
        }, 1000);
        ssTimer = setTimeout(() => {
          clearInterval(tickId);
          if (mySession !== ssSessionId || ssState !== 'playing') return;
          if (ssIdx < IDIOMS.length - 1) { ssIdx++; speakAndAdvanceSlideshow(mySession); }
          else if (document.getElementById('ss-loop-cb').checked) { ssIdx = 0; speakAndAdvanceSlideshow(mySession); }
          else { ssState = 'stopped'; updateSlideshowButtons(); }
        }, delayMs);
      };

      if (!('speechSynthesis' in window)) { ssTimer = setTimeout(advanceNext, 2200); return; }
      const u = new SpeechSynthesisUtterance(item.word);
      const best = pickBestChineseVoice();
      if (best) { u.voice = best; u.lang = best.lang; }
      else { u.lang = 'zh-HK'; }
      u.rate = speechRate;
      window.__ssUtterance = u;
      u.onend = advanceNext;
      u.onerror = advanceNext;
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    }

    function startSlideshow() {
      clearTimeout(ssTimer);
      if (ssState === 'paused') {
        ssState = 'playing';
        updateSlideshowButtons();
        if ('speechSynthesis' in window && window.speechSynthesis.paused) window.speechSynthesis.resume();
        else { ssSessionId++; speakAndAdvanceSlideshow(ssSessionId); }
        return;
      }
      ssState = 'playing';
      updateSlideshowButtons();
      ssSessionId++;
      const mySession = ssSessionId;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      setTimeout(() => speakAndAdvanceSlideshow(mySession), 80);
    }

    function pauseSlideshow() {

    let isHeaderMinimized = false;

    function setHeaderMinimized(min, isManual = false) {
      if (isHeaderMinimized === min) return;
      isHeaderMinimized = min;
      if (isManual) manualHeaderOverride = min;
      scrollLockUntil = Date.now() + 380;

      const collapsible = document.getElementById('header-collapsible');
      const inner = document.getElementById('header-inner');
      const sub = document.getElementById('header-subtitle');
      const logo = document.getElementById('header-logo');
      const toggleBtn = document.getElementById('toggle-menu-btn');

        inner.classList.replace('py-2.5', 'py-1.5');
        logo.classList.replace('w-11', 'w-8');

      }
      requestAnimationFrame(() => {
        lastScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      });
    }

    window.addEventListener('scroll', () => {
      const currY = window.scrollY || document.documentElement.scrollTop || 0;
      if (Date.now() < scrollLockUntil) {
        lastScrollY = currY;
        return;
      }
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll < 140) {
        lastScrollY = currY;
        return;
      }
      const delta = currY - lastScrollY;
      if (currY <= 15) {
        manualHeaderOverride = false;
        setHeaderMinimized(false);
      } else if (!manualHeaderOverride && delta > 16 && currY > 120) {
        setHeaderMinimized(true);
      } else if (!manualHeaderOverride && delta < -45) {

      }

      for (let i = a.length - 1; i > 0; i--) {

        [a[i], a[j]] = [a[j], a[i]];
      }

    // Subtle Web Audio chime
    function playTone(ok) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = ok ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(ok ? 660 : 220, ctx.currentTime);
        if (ok) osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

      document.getElementById('games-tag-btn').className = 'comic-pill px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#2563EB] text-white';

    });

    document.getElementById('back-to-hub-btn').addEventListener('click', openGameHub);

            <div class="flex items-center justify-between gap-2">
              <span class="font-black text-[#1E293B]">${r.title}</span>

            </div>
            <div class="text-slate-700 font-medium">${r.prompt}</div>
            <div>
              <span class="${r.ok ? 'text-emerald-700 font-bold' : 'text-red-700 font-bold'}">你的答案：${r.userAns}</span>

      document.getElementById('game-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center space-y-2">
            <div class="text-4xl">🐱⭐</div>
            <h3 class="font-serif-tc text-2xl font-black text-[#1E293B]">挑戰完成！成績總結</h3>
            <p class="text-base font-bold text-[#2563EB]">${label}</p>
          </div>

          <div class="grid grid-cols-3 gap-2.5 text-center">
            <div class="p-3 rounded-2xl bg-emerald-50 border-2 border-emerald-300">
              <div class="text-xs font-bold text-emerald-700">答對</div>
              <div class="text-2xl font-black text-emerald-900">${rightCnt}</div>
            </div>
            <div class="p-3 rounded-2xl bg-red-50 border-2 border-red-300">

              <div class="text-2xl font-black text-red-800">${wrongCnt}</div>
            </div>
            <div class="p-3 rounded-2xl bg-amber-50 border-2 border-amber-300">
              <div class="text-xs font-bold text-amber-800">總題數</div>
              <div class="text-2xl font-black text-amber-900">${rows.length}</div>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div class="flex gap-2">
              <button id="g-filter-all" type="button" class="px-3 py-1 rounded-full text-xs font-bold bg-[#1E293B] text-white">顯示全部</button>
              <button id="g-filter-wrong" type="button" class="px-3 py-1 rounded-full text-xs font-bold bg-white border border-[#1E293B] text-[#1E293B]">只看錯題</button>
            </div>
            <div class="flex gap-2">
              <button id="g-retry-btn" type="button" class="comic-pill px-4 py-1.5 rounded-full bg-[#2563EB] text-white font-bold text-xs sm:text-sm">再玩一次</button>
              <button id="g-hub-btn" type="button" class="comic-pill px-4 py-1.5 rounded-full bg-white text-[#1E293B] font-bold text-xs sm:text-sm">返回遊戲區</button>
            </div>
          </div>

      renderSummaryList(false);
      document.getElementById('g-filter-all').addEventListener('click', () => {
        document.getElementById('g-filter-all').className = 'px-3 py-1 rounded-full text-xs font-bold bg-[#1E293B] text-white';
        document.getElementById('g-filter-wrong').className = 'px-3 py-1 rounded-full text-xs font-bold bg-white border border-[#1E293B] text-[#1E293B]';

    // 1. 🧩 成語配對 (3 rounds x 5 idioms, with Prev/Next Round & Summary)
    function startMatchGame() {
      document.getElementById('game-title').textContent = '🧩 成語配對';
      let round = 1;
      const pool = shuffleArr(IDIOMS).slice(0, 15);
      const roundState = [1, 2, 3].map(r => {
        const chunk = pool.slice((r - 1) * 5, r * 5);
        return {
          chunk,
          rights: shuffleArr(chunk),
          matched: new Set(),
          hadMistake: new Set()
        };
      });

      function finishMatch() {
        const rows = [];
        let score = 0;
        roundState.forEach((rs, rIdx) => {
          rs.chunk.forEach((it, i) => {
            const ok = rs.matched.has(it.id) && !rs.hadMistake.has(it.id);
            if (ok) score++;
            rows.push({
              title: `第${rIdx + 1}輪 (${i + 1})｜${it.word}`,
              prompt: `配對意思：${it.meaning}`,
              userAns: rs.matched.has(it.id) ? (rs.hadMistake.has(it.id) ? '曾配錯後完成' : it.word) : '未完成',
              rightAns: it.word,
              ok,
              note: `例句：${it.example}`
            });
          });
        });
        showGameFinish('match', score, `完成配對！一次答對 ${score} / 15 組`, rows, startMatchGame);
      }

      function renderRound() {
        const rs = roundState[round - 1];
        let selLeft = null;
        const totalMatched = roundState.reduce((acc, r) => acc + r.matched.size, 0);

        function draw() {
          document.getElementById('game-content').innerHTML = `
            <div class="flex items-center justify-between flex-wrap gap-2">
              <span class="px-3 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B] text-xs font-bold">第 ${round}/3 輪 ｜ 已配對 ${totalMatched + (rs.matched.size - rs.matched.size)} / 15</span>
              <span class="text-xs font-bold text-slate-500">先按一個成語，再按它的解釋 👇</span>
            </div>
            <div class="grid grid-cols-12 gap-3">
              <div class="col-span-5 space-y-2" id="gm-left">
                ${rs.chunk.map(it => {
                  const done = rs.matched.has(it.id);
                  const active = selLeft === it.id;
                  return `<button type="button" data-lid="${it.id}" ${done ? 'disabled' : ''} class="w-full py-3 px-2 rounded-2xl border-2 text-sm sm:text-base font-black transition ${
                    done ? 'bg-emerald-100 border-emerald-500 text-emerald-800 opacity-60' :
                    active ? 'bg-[#2563EB] border-[#1E293B] text-white shadow-[2px_2px_0px_#1E293B]' :
                    'bg-white border-purple-200 hover:border-[#1E293B] text-[#1E293B]'
                  }">${it.word}</button>`;
                }).join('')}
              </div>
              <div class="col-span-7 space-y-2" id="gm-right">
                ${rs.rights.map(it => {
                  const done = rs.matched.has(it.id);
                  return `<button type="button" data-rid="${it.id}" ${done ? 'disabled' : ''} class="w-full text-left py-2.5 px-3 rounded-2xl border-2 text-xs sm:text-sm font-semibold transition ${
                    done ? 'bg-emerald-100 border-emerald-500 text-emerald-800 opacity-60' :
                    'bg-white border-purple-200 hover:border-[#1E293B] text-[#1E293B]'
                  }">${it.meaning}</button>`;
                }).join('')}
              </div>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-200">
              <button id="gm-prev" type="button" ${round === 1 ? 'disabled' : ''} class="px-4 py-1.5 rounded-full bg-white border-2 border-[#1E293B] text-xs font-bold ${round === 1 ? 'opacity-40' : 'hover:bg-slate-100'}">← 上一輪</button>
              <button id="gm-next" type="button" class="px-4 py-1.5 rounded-full bg-[#1E293B] text-white text-xs font-bold hover:bg-slate-700">${round === 3 ? '查看總結 →' : '下一輪 →'}</button>
            </div>
          `;
          document.querySelectorAll('#gm-left button').forEach(b => {
            b.addEventListener('click', () => { selLeft = parseInt(b.dataset.lid, 10); draw(); });
          });
          document.querySelectorAll('#gm-right button').forEach(b => {
            b.addEventListener('click', () => {
              if (selLeft === null) return;
              const rid = parseInt(b.dataset.rid, 10);
              if (selLeft === rid) {
                playTone(true);
                rs.matched.add(rid);
                selLeft = null;
                if (rs.matched.size === 5) {
                  if (round < 3) { round++; setTimeout(renderRound, 320); }
                  else { setTimeout(finishMatch, 320); }
                } else draw();
              } else {
                playTone(false);
                rs.hadMistake.add(selLeft);
                b.classList.add('bg-red-100', 'border-red-500');
                setTimeout(() => { selLeft = null; draw(); }, 320);
              }
            });
          });
          document.getElementById('gm-prev').addEventListener('click', () => { if (round > 1) { round--; renderRound(); } });
          document.getElementById('gm-next').addEventListener('click', () => { if (round < 3) { round++; renderRound(); } else finishMatch(); });
        }
        draw();
      }
      renderRound();
    }

    // 2. 🖼️ 看圖猜成語 (10 questions, Prev/Next + Summary)
    function startPicGame() {
      document.getElementById('game-title').textContent = '🖼️ 看圖猜成語';
      const qs = shuffleArr(IDIOMS).slice(0, 10).map(target => {
        const distractors = shuffleArr(IDIOMS.filter(x => x.id !== target.id)).slice(0, 3);
        return { target, opts: shuffleArr([target, ...distractors]), chosenId: null };
      });
      let idx = 0;

      function finishPic() {
        let score = 0;
        const rows = qs.map((q, i) => {
          const ok = q.chosenId === q.target.id;
          if (ok) score++;
          const chosenObj = IDIOMS.find(x => x.id === q.chosenId);
          return {
            title: `第 ${i + 1} 題`,
            prompt: `圖片對應成語：${q.target.meaning}`,
            userAns: chosenObj ? chosenObj.word : '（未作答）',
            rightAns: q.target.word,
            ok,
            note: `例句：${q.target.example}`
          };
        });
        showGameFinish('pic', score, `看圖猜成語得分：${score} / 10 題`, rows, startPicGame);
      }

      function renderQ() {
        const q = qs[idx];
        const target = q.target;
        const answered = q.chosenId !== null;
        const score = qs.filter(x => x.chosenId === x.target.id).length;

        document.getElementById('game-content').innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B] text-xs font-bold">第 ${idx + 1}/10 題 ｜ ✓ ${score}</span>
            <button id="gp-end" type="button" class="text-xs font-bold text-[#2563EB] underline">結束並看總結</button>
          </div>
          <p class="text-center font-bold text-base sm:text-lg">這幅圖畫的是哪個成語？</p>
          <div class="max-w-sm mx-auto rounded-2xl overflow-hidden border-2 border-[#1E293B] bg-white shadow-[3px_3px_0px_#1E293B]">
            <img src="${target.img}" alt="猜成語圖片" class="w-full h-52 object-cover" />
          </div>
          <div class="grid grid-cols-2 gap-3 pt-1">
            ${q.opts.map(o => {
              let cls = 'bg-white border-purple-200 hover:border-[#1E293B]';
              if (answered) {
                if (o.id === target.id) cls = 'bg-emerald-100 border-emerald-600 text-emerald-900';
                else if (o.id === q.chosenId) cls = 'bg-red-100 border-red-500 text-red-900';
              }
              return `<button type="button" data-oid="${o.id}" ${answered ? 'disabled' : ''} class="gp-opt py-3.5 px-3 rounded-2xl border-2 font-black text-base sm:text-lg transition ${cls}">${o.word}</button>`;
            }).join('')}
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-200">
            <button id="gp-prev" type="button" ${idx === 0 ? 'disabled' : ''} class="px-4 py-1.5 rounded-full bg-white border-2 border-[#1E293B] text-xs font-bold ${idx === 0 ? 'opacity-40' : 'hover:bg-slate-100'}">← 上一題</button>
            <button id="gp-next" type="button" class="px-4 py-1.5 rounded-full bg-[#1E293B] text-white text-xs font-bold hover:bg-slate-700">${idx === 9 ? '查看總結 →' : '下一題 →'}</button>
          </div>
        `;
        if (!answered) {
          document.querySelectorAll('.gp-opt').forEach(btn => {
            btn.addEventListener('click', () => {
              q.chosenId = parseInt(btn.dataset.oid, 10);
              playTone(q.chosenId === target.id);
              renderQ();
            });
          });
        }
        document.getElementById('gp-prev').addEventListener('click', () => { if (idx > 0) { idx--; renderQ(); } });
        document.getElementById('gp-next').addEventListener('click', () => { if (idx < 9) { idx++; renderQ(); } else finishPic(); });
        document.getElementById('gp-end').addEventListener('click', finishPic);
      }
      renderQ();
    }

    // 3. ✏️ 填字挑戰（正字）(All 正字 items, Prev/Next + Summary)
    const TEXTBOOK_WRONGS = {
      '沸': ['佛', '弗', '費'], '敷': ['數', '傅', '夫'], '玲': ['鈴', '零', '令'],
      '瓏': ['龍', '籠', '攏'], '鑽': ['讚', '贊', '專'], '竭': ['歇', '渴', '喝'],
      '嘶': ['斯', '撕', '西'], '均': ['勻', '軍', '君'], '赦': ['敖', '赤', '卸'],
      '令': ['今', '冷', '零'], '申': ['伸', '神', '甲'], '效': ['郊', '校', '交'],
      '亡': ['忘', '芒', '忙'], '迢': ['紹', '招', '條'], '恩': ['思', '忠', '忘'],
      '鈞': ['均', '軍', '勻'], '髮': ['發', '拔', '撥'], '載': ['栽', '裁', '再'],
      '煉': ['練', '揀', '東'], '碑': ['啤', '牌', '悲'], '蜜': ['密', '秘', '甜'],
      '腹': ['複', '覆', '復'], '鼎': ['目', '日', '貝'], '擂': ['雷', '蕾', '類'],
      '慚': ['斬', '暫', '漸'], '逕': ['脛', '經', '輕'], '撈': ['勞', '澇', '牢'],
      '霆': ['延', '挺', '停'], '已': ['己', '巳', '以'], '器': ['大', '哭', '臭']
    };

    function buildAllFillQuestions() {
      const list = [];
      IDIOMS.forEach(item => {
        if (!item.typoIdx || !item.typoIdx.length) return;
        const seenChar = new Set();
        item.typoIdx.forEach(pos => {
          const ch = item.word[pos];
          if (seenChar.has(ch)) return;
          seenChar.add(ch);
          const wrongs = (TEXTBOOK_WRONGS[ch] || ['人', '大', '心']).filter(c => c !== ch).slice(0, 3);
          list.push({ item, pos, ch, opts: shuffleArr([ch, ...wrongs]), chosenChar: null });
        });
      });
      return list;
    }

    function startFillGame() {
      document.getElementById('game-title').textContent = '✏️ 填字挑戰（全部正字）';
      const qs = shuffleArr(buildAllFillQuestions());
      const total = qs.length;
      let idx = 0;

      function finishFill() {
        let score = 0;
        const rows = qs.map((q, i) => {
          const ok = q.chosenChar === q.ch;
          if (ok) score++;
          return {
            title: `第 ${i + 1} 題｜${q.item.word}`,
            prompt: `填入正字：${q.item.word.split('').map((c, ci) => ci === q.pos ? '（　）' : c).join('')}`,
            userAns: q.chosenChar || '（未作答）',
            rightAns: q.ch,
            ok,
            note: q.item.typoNote ? `正字提醒：${q.item.typoNote}` : q.item.meaning
          };
        });
        showGameFinish('fill', score, `填字正字挑戰得分：${score} / ${total} 題`, rows, startFillGame);
      }

      function renderQ() {
        const q = qs[idx];
        const target = q.item;
        const blankPos = q.pos;
        const correctChar = q.ch;
        const answered = q.chosenChar !== null;
        const ok = q.chosenChar === correctChar;
        const score = qs.filter(x => x.chosenChar === x.ch).length;

        document.getElementById('game-content').innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B] text-xs font-bold">第 ${idx + 1}/${total} 題 ｜ ✓ ${score}</span>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-slate-500">${target.page}</span>
              <button id="gf-end" type="button" class="text-xs font-bold text-[#2563EB] underline">結束並看總結</button>
            </div>
          </div>
          <p class="text-center font-bold text-base">選出正確的字，填進空格 ✏️</p>
          <div class="flex justify-center gap-2.5 py-2">
            ${target.word.split('').map((ch, ci) => {
              if (ci !== blankPos) {
                return `<div class="w-16 h-16 rounded-2xl border-2 border-purple-300 bg-white flex items-center justify-center font-serif-tc font-black text-3xl text-[#1E293B]">${ch}</div>`;
              }
              if (!answered) {
                return `<div class="w-16 h-16 rounded-2xl border-2 border-dashed border-amber-500 bg-amber-50 flex items-center justify-center font-serif-tc font-black text-3xl text-[#2563EB]">？</div>`;
              }
              return `<div class="w-16 h-16 rounded-2xl border-2 flex items-center justify-center font-serif-tc font-black text-3xl ${ok ? 'border-emerald-600 bg-emerald-100 text-emerald-900' : 'border-red-500 bg-red-100 text-red-900'}">${correctChar}</div>`;
            }).join('')}
          </div>
          <p class="text-center text-xs sm:text-sm text-slate-600 font-medium">💡 ${target.meaning}</p>
          ${answered && target.typoNote ? `<div class="text-center text-xs font-bold px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-900">⭕ 正字提醒：${target.typoNote}</div>` : ''}
          <div class="grid grid-cols-2 gap-3 pt-1">
            ${q.opts.map(ch => {
              let cls = 'bg-white border-purple-200 hover:border-[#1E293B]';
              if (answered) {
                if (ch === correctChar) cls = 'bg-emerald-100 border-emerald-600 text-emerald-900';
                else if (ch === q.chosenChar) cls = 'bg-red-100 border-red-500 text-red-900';
              }
              return `<button type="button" data-ch="${ch}" ${answered ? 'disabled' : ''} class="gf-opt py-3.5 rounded-2xl border-2 font-serif-tc font-black text-2xl transition ${cls}">${ch}</button>`;
            }).join('')}
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-200">
            <button id="gf-prev" type="button" ${idx === 0 ? 'disabled' : ''} class="px-4 py-1.5 rounded-full bg-white border-2 border-[#1E293B] text-xs font-bold ${idx === 0 ? 'opacity-40' : 'hover:bg-slate-100'}">← 上一題</button>
            <button id="gf-next" type="button" class="px-4 py-1.5 rounded-full bg-[#1E293B] text-white text-xs font-bold hover:bg-slate-700">${idx === total - 1 ? '查看總結 →' : '下一題 →'}</button>
          </div>
        `;
        if (!answered) {
          document.querySelectorAll('.gf-opt').forEach(btn => {
            btn.addEventListener('click', () => {
              q.chosenChar = btn.dataset.ch;
              playTone(q.chosenChar === correctChar);
              renderQ();
            });
          });
        }
        document.getElementById('gf-prev').addEventListener('click', () => { if (idx > 0) { idx--; renderQ(); } });
        document.getElementById('gf-next').addEventListener('click', () => { if (idx < total - 1) { idx++; renderQ(); } else finishFill(); });
        document.getElementById('gf-end').addEventListener('click', finishFill);
      }
      renderQ();
    }

    // 4. ⏱️ 限時挑戰 (60 seconds, Prev/Next + Summary)
    function startTimedGame() {
      document.getElementById('game-title').textContent = '⏱️ 限時挑戰';
      let timeLeft = 60;
      const pool = shuffleArr(IDIOMS);
      const qs = pool.map(target => {
        const distractors = shuffleArr(IDIOMS.filter(x => x.id !== target.id)).slice(0, 3);
        return { target, opts: shuffleArr([target, ...distractors]), chosenId: null };
      });
      let idx = 0;

      function finishTimed() {
        const attempted = qs.filter((q, i) => q.chosenId !== null || i <= idx);
        let rightCnt = 0;
        const rows = attempted.map((q, i) => {
          const ok = q.chosenId === q.target.id;
          if (ok) rightCnt++;
          const chosenObj = IDIOMS.find(x => x.id === q.chosenId);
          return {
            title: `第 ${i + 1} 題`,
            prompt: `意思：${q.target.meaning}`,
            userAns: chosenObj ? chosenObj.word : '（略過／未答）',
            rightAns: q.target.word,
            ok,
            note: `例句：${q.target.example}`
          };
        });
        const score = rightCnt * 10;
        showGameFinish('timed', score, `60 秒限時搶答總分：${score} 分（答對 ${rightCnt} 題）`, rows, startTimedGame);
      }

      function renderQ() {
        const q = qs[idx];
        const target = q.target;
        const answered = q.chosenId !== null;
        const score = qs.filter(x => x.chosenId === x.target.id).length * 10;

        document.getElementById('game-content').innerHTML = `
          <div class="flex items-center justify-between">
            <span id="gt-pill" class="px-3.5 py-1 rounded-full bg-[#FCD34D] border border-[#1E293B] text-xs sm:text-sm font-bold">⏱️ ${timeLeft} 秒 ｜ 🏅 ${score} 分</span>
            <button id="gt-end" type="button" class="text-xs font-bold text-[#2563EB] underline">提早結束看總結</button>
          </div>
          <div class="w-full h-3 bg-slate-100 rounded-full border border-[#1E293B] overflow-hidden">
            <div id="gt-bar" class="h-full bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 transition-all duration-1000" style="width:${(timeLeft/60)*100}%"></div>
          </div>
          <div class="text-center space-y-2 py-2">
            <p class="text-sm font-bold text-slate-600">第 ${idx + 1} 題：哪個成語的意思是：</p>
            <p class="text-base sm:text-lg font-black text-purple-800">${target.meaning}</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${q.opts.map(o => {
              let cls = 'bg-white border-purple-200 hover:border-[#1E293B]';
              if (answered) {
                if (o.id === target.id) cls = 'bg-emerald-100 border-emerald-600 text-emerald-900';
                else if (o.id === q.chosenId) cls = 'bg-red-100 border-red-500 text-red-900';
              }
              return `<button type="button" data-oid="${o.id}" ${answered ? 'disabled' : ''} class="gt-opt py-3.5 px-3 rounded-2xl border-2 font-black text-base sm:text-lg transition ${cls}">${o.word}</button>`;
            }).join('')}
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-200">
            <button id="gt-prev" type="button" ${idx === 0 ? 'disabled' : ''} class="px-4 py-1.5 rounded-full bg-white border-2 border-[#1E293B] text-xs font-bold ${idx === 0 ? 'opacity-40' : 'hover:bg-slate-100'}">← 上一題</button>
            <button id="gt-next" type="button" class="px-4 py-1.5 rounded-full bg-[#1E293B] text-white text-xs font-bold hover:bg-slate-700">${idx === qs.length - 1 ? '查看總結 →' : '下一題 →'}</button>
          </div>
        `;

        if (!answered) {
          document.querySelectorAll('.gt-opt').forEach(btn => {
            btn.addEventListener('click', () => {
              q.chosenId = parseInt(btn.dataset.oid, 10);
              playTone(q.chosenId === target.id);
              renderQ();
            });
          });
        }
        document.getElementById('gt-prev').addEventListener('click', () => { if (idx > 0) { idx--; renderQ(); } });
        document.getElementById('gt-next').addEventListener('click', () => { if (idx < qs.length - 1) { idx++; renderQ(); } else finishTimed(); });
        document.getElementById('gt-end').addEventListener('click', finishTimed);
      }

      renderQ();
      gameTimerId = setInterval(() => {
        timeLeft--;
        const pill = document.getElementById('gt-pill');
        const bar = document.getElementById('gt-bar');
        const score = qs.filter(x => x.chosenId === x.target.id).length * 10;
        if (pill) pill.textContent = `⏱️ ${timeLeft} 秒 ｜ 🏅 ${score} 分`;
        if (bar) bar.style.width = `${Math.max(0, (timeLeft / 60) * 100)}%`;
        if (timeLeft <= 0) finishTimed();
      }, 1000);
    }

    document.querySelectorAll('.game-launch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        stopActiveGame();
        document.getElementById('game-hub').classList.add('hidden');
        document.getElementById('game-stage').classList.remove('hidden');
        const g = btn.dataset.game;
        if (g === 'match') startMatchGame();
        else if (g === 'pic') startPicGame();
        else if (g === 'fill') startFillGame();
        else if (g === 'timed') startTimedGame();
      });
    });

    // Init
    renderIdiom();
  </script>
</body>
</html>
