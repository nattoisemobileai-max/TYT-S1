<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語極速賽車</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 400px;
            height: 600px;
            background: #333;
            border: 4px solid #555;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        /* 賽道背景 */
        .road {
            width: 100%;
            height: 200%;
            background: repeating-linear-gradient(
                to bottom,
                #444 0px,
                #444 40px,
                #555 40px,
                #555 80px
            );
            position: absolute;
            top: -100%;
            animation: moveRoad 1s linear infinite;
        }
        @keyframes moveRoad {
            0% { top: -100%; }
            100% { top: 0%; }
        }
        /* 玩家車輛 */
        #car {
            width: 50px;
            height: 90px;
            background: #ff3b30;
            position: absolute;
            bottom: 30px;
            left: 175px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        /* 頂部狀態列 */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
        }
        /* 問答彈窗 */
        #quiz-box {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-top: 3px solid #007aff;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            z-index: 20;
            border-radius: 16px 16px 0 0;
        }
        .question-text {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background: #3a3a3c;
        }
    </style>
</head>
<body>

    <h2>🚗 成語極速賽車 (2D Prototype)</h2>
    <div id="game-container">
        <div class="road" id="road"></div>
        
        <div id="hud">
            <span id="score-text">分數: 0</span>
            <span id="speed-text">速度: 120 km/h</span>
        </div>

        <div id="car">🏎️</div>

        <!-- 問答對話框 -->
        <div id="quiz-box">
            <div class="question-text" id="q-text">題目載入中...</div>
            <div id="options-container"></div>
        </div>
    </div>

<script>
    const questions = [
        {
            q: "下列哪一個成語的寫法是**正確**的？",
            options: ["A. 走投無路", "B. 走頭無路", "C. 走途無路"],
            answer: 0
        },
        {
            q: "「刻舟求劍」比喻做事方法怎麼樣？",
            options: ["A. 機智靈活", "B. 墨守成規、不知變通", "C. 高瞻遠矚"],
            answer: 1
        },
        {
            q: "以下邊個成語係形容做事專心致志？",
            options: ["A. 三心兩意", "B. 心猿意馬", "C. 全神貫注"],
            answer: 2
        }
    ];

    let score = 0;
    let currentQIndex = 0;
    const road = document.getElementById('road');
    const quizBox = document.getElementById('quiz-box');
    const qText = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const scoreText = document.getElementById('score-text');
    const speedText = document.getElementById('speed-text');

    // 設定賽道速度
    function setSpeed(duration) {
        road.style.animationDuration = duration + 's';
    }

    // 隨機觸發成語題目
    function triggerQuiz() {
        setSpeed(3); // 減慢速度等玩家答題
        speedText.innerText = "速度: 60 km/h (思考中)";
        
        const q = questions[currentQIndex];
        qText.innerText = q.q;
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index === q.answer);
            optionsContainer.appendChild(btn);
        });

        quizBox.style.display = 'block';
    }

    // 檢查答案
    function checkAnswer(isCorrect) {
        quizBox.style.display = 'none';
        
        if (isCorrect) {
            score += 100;
            speedText.innerText = "加速中！ 🚀 180 km/h";
            setSpeed(0.4); // 爆發高速
            alert("答對！獲得 +80% 加速衝刺！");
        } else {
            speedText.innerText = "答錯減速！ 🐢 80 km/h";
            setSpeed(2);
            alert("哎呀！答錯咗，架車慢咗落嚟！");
        }

        scoreText.innerText = "分數: " + score;
        currentQIndex = (currentQIndex + 1) % questions.length;

        // 5秒後再出下一條題
        setTimeout(triggerQuiz, 4000);
    }

    // 遊戲開始後 2 秒彈出第一條題
    setTimeout(triggerQuiz, 2000);
</script>

</body>
</html>
