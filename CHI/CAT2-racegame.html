<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 成語極速賽車 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* 頂部狀態列 (HUD) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* 答題彈窗 */
        #quiz-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 480px;
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid #00d2ff;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,210,255,0.4);
        }
        .status-badge {
            background: #ff3b30;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .question-text {
            font-size: 17px;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.4;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #2c3e50;
            border: 1px solid #34495e;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #00d2ff;
            color: #000;
            font-weight: bold;
        }
        /* 操作提示 */
        #controls-tip {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #aaa;
            pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-panel" id="score-display">分數: 0</div>
        <div class="hud-panel" id="speed-display">速度: 240 km/h</div>
    </div>

    <div id="controls-tip">提示：按 A / D 鍵或 ⬅️ ➡️ 左右切換賽道位置</div>
    <div id="canvas-container"></div>

    <!-- 答題互動介面 -->
    <div id="quiz-box">
        <div id="quiz-status" class="status-badge">⚡ 成語挑戰！</div>
        <div class="question-text" id="q-text">載入中...</div>
        <div id="options-container"></div>
    </div>

<script>
    // --- 1. 3D 場景與 F1 賽道初始化 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510); // 深空藍背景

    // 攝影機 (動感追尾視角)
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.2, -4.5);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 燈光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 20, -10);
    scene.add(dirLight);

    // --- 2. 建立具備彎道流線感的正常賽道 ---
    // 用圓柱曲線（TubeGeometry）或者分段平面模擬彎道賽道
    const trackWidth = 12;
    const trackLength = 400;
    const roadGeo = new THREE.PlaneGeometry(trackWidth, trackLength, 20, 100);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // 賽道兩旁紅白邊界石 (Kerbs)
    const kerbGeo = new THREE.BoxGeometry(0.6, 0.1, trackLength);
    const kerbMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    
    const leftKerb = new THREE.Mesh(kerbGeo, kerbMat);
    leftKerb.position.set(-trackWidth/2 - 0.3, 0.02, 0);
    scene.add(leftKerb);

    const rightKerb = new THREE.Mesh(kerbGeo, kerbMat);
    rightKerb.position.set(trackWidth/2 + 0.3, 0.02, 0);
    scene.add(rightKerb);


    // --- 3. 建立精細 F1 賽車模型 ---
    const f1Group = new THREE.Group();
    const f1Mat = new THREE.MeshStandardMaterial({ color: 0xff1801, metalness: 0.7, roughness: 0.2 }); //法拉利紅

    // F1 車身主體 (流線尖頭)
    const mainBodyGeo = new THREE.BoxGeometry(0.9, 0.3, 2.8);
    const mainBody = new THREE.Mesh(mainBodyGeo, f1Mat);
    mainBody.position.y = 0.2;
    f1Group.add(mainBody);

    // F1 駕駛艙/頭盔
    const cockpitGeo = new THREE.BoxGeometry(0.4, 0.25, 0.6);
    const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
    cockpit.position.set(0, 0.35, -0.1);
    f1Group.add(cockpit);

    // F1 前翼 (Front Wing)
    const frontWingGeo = new THREE.BoxGeometry(2.2, 0.08, 0.6);
    const frontWing = new THREE.Mesh(frontWingGeo, f1Mat);
    frontWing.position.set(0, 0.08, 1.4);
    f1Group.add(frontWing);

    // F1 後翼 (Rear Wing)
    const rearWingGeo = new THREE.BoxGeometry(1.8, 0.4, 0.3);
    const rearWing = new THREE.Mesh(rearWingGeo, f1Mat);
    rearWing.position.set(0, 0.6, -1.3);
    f1Group.add(rearWing);

    // 車輪 (四個輪)
    const wheelGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

    const wheelPositions = [
        [-0.9, 0.25, 1.0],  // 左前
        [ 0.9, 0.25, 1.0],  // 右前
        [-0.9, 0.25, -1.0], // 左後
        [ 0.9, 0.25, -1.0]  // 右後
    ];

    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        f1Group.add(wheel);
    });

    f1Group.position.set(0, 0, 0);
    scene.add(f1Group);


    // --- 4. 遊戲邏輯與鍵盤左右移動控制 ---
    const questions = [
        {
            q: "以下邊個成語嘅寫法係「正確」嘅？",
            options: ["A. 走投無路", "B. 走頭無路", "C. 走途無路"],
            answer: 0
        },
        {
            q: "「刻舟求劍」比喻一個人處事有咩問題？",
            options: ["A. 過度急躁", "B. 墨守成規、不知變通", "C. 盲目自信"],
            answer: 1
        },
        {
            q: "以下邊個成語係形容做事專心致志，全神貫注？",
            options: ["A. 心猿意馬", "B. 三心兩意", "C. 專心致志"],
            answer: 2
        }
    ];

    let currentSpeed = 0.6;
    let score = 0;
    let isPaused = false;
    let currentQIndex = 0;
    
    // 車輛左右移動目標位置
    let targetX = 0;
    const maxLaneX = 4.5;

    // 監聽鍵盤左右控制 (A/D 或 左右方向鍵)
    window.addEventListener('keydown', (e) => {
        if (isPaused) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            targetX = Math.min(targetX + 2.5, maxLaneX); // 向左移
        }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            targetX = Math.max(targetX - 2.5, -maxLaneX); // 向右移
        }
    });

    const quizBox = document.getElementById('quiz-box');
    const qText = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const scoreDisplay = document.getElementById('score-display');
    const speedDisplay = document.getElementById('speed-display');

    function triggerQuiz() {
        isPaused = true;
        currentSpeed = 0.15; // 答題時減速
        speedDisplay.innerText = "速度: 120 km/h (思考中)";
        
        const q = questions[currentQIndex];
        qText.innerText = q.q;
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index === q.answer);
            optionsContainer.appendChild(btn);
        });

        quizBox.style.display = 'block';
    }

    function checkAnswer(isCorrect) {
        quizBox.style.display = 'none';
        isPaused = false;
        
        if (isCorrect) {
            score += 100;
            currentSpeed = 1.5; // 答對爆發加速！
            speedDisplay.innerText = "加速衝刺！ 🚀 320 km/h";
            document.getElementById('quiz-status').innerText = "答對！+80% 加速";
            document.getElementById('quiz-status').style.background = "#28a745";
        } else {
            currentSpeed = 0.3;
            speedDisplay.innerText = "答錯減速 🐢 150 km/h";
            document.getElementById('quiz-status').innerText = "哎呀！答錯咗";
            document.getElementById('quiz-status').style.background = "#dc3545";
        }

        scoreDisplay.innerText = "分數: " + score;
        currentQIndex = (currentQIndex + 1) % questions.length;

        // 5秒後自動下一條題目
        setTimeout(triggerQuiz, 5000);
    }

    // --- 5. 動畫循環與賽道彎道模擬 ---
    let clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        let time = clock.getElapsedTime();

        if (!isPaused) {
            // 賽道滾動向前
            road.position.z -= currentSpeed;
            if (road.position.z < -200) {
                road.position.z = 0;
            }

            // 讓賽道產生輕微的左右S形彎道弧度，提升真實感
            road.position.x = Math.sin(time * 0.5) * 1.5;
            leftKerb.position.x = road.position.x - trackWidth/2 - 0.3;
            rightKerb.position.x = road.position.x + trackWidth/2 - 0.3;
        }

        // 車輛平滑左右移動 (Lerp) 配合過彎傾側效果
        f1Group.position.x += (targetX - f1Group.position.x) * 0.1;
        // 轉彎時車身輕微傾側（Bank angle）
        f1Group.rotation.z = (f1Group.position.x - targetX) * 0.1;

        // 相機同步跟隨車輛
        camera.position.x = f1Group.position.x * 0.5;
        camera.lookAt(f1Group.position.x, f1Group.position.y + 0.5, f1Group.position.y + 3);

        renderer.render(scene, camera);
    }

    animate();

    // 視窗自動適應
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3秒後彈出第一條成語題
    setTimeout(triggerQuiz, 3000);
</script>

</body>
</html>
