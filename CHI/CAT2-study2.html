    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    /* Stage 1: Character Pop-in */
    @keyframes charPop {
      0% { opacity: 0; transform: scale(0.55) translateY(16px); }
      70% { opacity: 1; transform: scale(1.06) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .char-pop {
      animation: charPop 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* Stage 2: Red Hand-Drawn Circle SVG */
    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }
    .red-circle-stroke {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: drawCircle 0.75s ease-out forwards;
    }
    /* Stage 3-5: Reveal Slide-Up */
    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .reveal-up {
      animation: revealUp 0.45s ease-out forwards;
    }
    .marker-highlight {
      background-image: linear-gradient(120deg, #fde68a 0%, #fcd34d 100%);
      background-repeat: no-repeat;
      background-position: 0 85%;
      background-size: 100% 42%;
      padding: 0 3px;
      border-radius: 3px;
    }
    /* Tian-zi-ge calligraphy box */
    .tianzige {
      background-image:
        linear-gradient(to right, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%),
        linear-gradient(to bottom, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%);

    /* Active speaking highlight */
    .speaking-ring {
      box-shadow: 0 0 0 3px #10b981;
      border-radius: 1rem;
      transition: box-shadow 0.25s ease;
    }

    function populateSelect() {

        opt.textContent = `${item.id}. ${item.word} (${item.page})`;

      idiomSelect.value = currentIndex;

      idiomSelect.value = currentIndex;

      // Stage 1: Render 4 super-large characters
      charsStage.innerHTML = '';
      [...item.word].forEach((ch, idx) => {
        const pronText = item.pron[idx] ? `(${item.pron[idx]})` : '';
        const isTypo = item.typoIdx.includes(idx);

        const cell = document.createElement('div');
        cell.className = 'flex flex-col items-center';
        cell.innerHTML = `

    function applyStageVisibility() {
      // Stage 2: red circles + alert
      document.querySelectorAll('.typo-svg').forEach(svg => {
        svg.classList.toggle('hidden', currentStage < 2);
      });
      stage2Box.classList.toggle('hidden', currentStage < 2);
      stage3Box.classList.toggle('hidden', currentStage < 3);
      stage4Box.classList.toggle('hidden', currentStage < 4);
      stage5Box.classList.toggle('hidden', currentStage < 5);

      // Update stage pills
      document.querySelectorAll('.stage-pill').forEach(pill => {
        const st = Number(pill.dataset.jumpStage);
        if (st === currentStage) {
          pill.className = 'stage-pill py-1.5 px-1 rounded-xl border-2 border-[#b91c1c] bg-[#b91c1c] text-white font-bold transition shadow-sm';
        } else if (st < currentStage) {
          pill.className = 'stage-pill py-1.5 px-1 rounded-xl border border-amber-300 bg-amber-100 text-amber-900 font-semibold transition';
        } else {
          pill.className = 'stage-pill py-1.5 px-1 rounded-xl border border-stone-300 bg-white text-stone-400 transition';
        }
      });
    }

        animTimer = null;

        } else {
          clearAutoAnim();
        }
      }, 1300);
    }

    // ==================== CANTONESE SPEECH SYNTHESIS (WITH COLLOCATIONS, SYNONYMS & ANTONYMS) ====================
    const speakBtn = document.getElementById('speak-btn');
    const pauseSpeakBtn = document.getElementById('pause-speak-btn');
    const stopSpeakBtn = document.getElementById('stop-speak-btn');

    function clearSpeakingHighlights() {
      [stage12Box, stage3Box, stage4Box, stage5Box].forEach(el => el.classList.remove('speaking-ring'));
      speakingStatusBadge.classList.add('hidden');
    }

    function resetSpeechButtons() {
      speakBtn.classList.remove('hidden');
      pauseSpeakBtn.classList.add('hidden');
      stopSpeakBtn.classList.add('hidden');
      pauseSpeakBtn.textContent = '⏸ 暫停讀音';
      clearSpeakingHighlights();
    }

    function getCantoneseVoice() {
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find(v => v.lang.toLowerCase().includes('zh-hk')) ||
        voices.find(v => v.name.includes('Cantonese') || v.name.includes('Sin-Ji') || v.name.includes('HiuGaai') || v.name.includes('HiuMaan')) ||
        voices.find(v => v.lang.toLowerCase().includes('zh'))
      );
    }

    function formatMorphemesForSpeech(raw) {
      // 把「窮：窮困、困厄；志：志向」轉為更自然易聽的廣東話斷句
      return raw
        .replace(/：/g, '，即係')
        .replace(/；/g, '。')
        .replace(/、/g, '、');
    }

    function speakCurrentIdiom() {
      if (!('speechSynthesis' in window)) {
        alert('你的瀏覽器暫不支援語音朗讀功能。');
        return;
      }

      clearAutoAnim();
      window.speechSynthesis.cancel();

      const item = filteredIdioms[currentIndex];
      const voice = getCantoneseVoice();

      // 組合分段朗讀序列，並同步對應動畫階段與視覺高亮
      const segments = [
        {
          stage: 1,
          box: stage12Box,
          text: `成語：${item.word}。`
        },
        {
          stage: 3,
          box: stage3Box,
          text: `配詞拆解：${formatMorphemesForSpeech(item.morphemes)}。`
        }
      ];

      // 加入近義詞朗讀
      if (item.syn && item.syn.length > 0) {
        segments.push({
          stage: 3,
          box: stage3Box,
          text: `近義詞有：${item.syn.join('、')}。`
        });
      } else {
        segments.push({
          stage: 3,
          box: stage3Box,
          text: `呢個成語冇特別嘅近義詞。`
        });
      }

      // 加入反義詞朗讀
      if (item.ant && item.ant.length > 0) {
        segments.push({
          stage: 3,
          box: stage3Box,
          text: `反義詞有：${item.ant.join('、')}。`
        });
      } else {
        segments.push({
          stage: 3,
          box: stage3Box,
          text: `呢個成語冇特別嘅反義詞。`
        });
      }

      // 加入解釋與例句
      segments.push(
        {
          stage: 4,
          box: stage4Box,
          text: `解釋：${item.meaning} 屬於${item.sentiment}，${item.target}。`
        },
        {
          stage: 5,
          box: stage5Box,
          text: `例句：${item.example}`
        }
      );

      speakBtn.classList.add('hidden');
      pauseSpeakBtn.classList.remove('hidden');
      stopSpeakBtn.classList.remove('hidden');
      speakingStatusBadge.classList.remove('hidden');

      let segIndex = 0;

      function playNextSegment() {
        if (segIndex >= segments.length) {
          resetSpeechButtons();
          return;
        }

        const seg = segments[segIndex];
        if (currentStage < seg.stage) {
          currentStage = seg.stage;
          applyStageVisibility();
        }

        clearSpeakingHighlights();
        speakingStatusBadge.classList.remove('hidden');
        seg.box.classList.add('speaking-ring');

        const utter = new SpeechSynthesisUtterance(seg.text);
        utter.lang = 'zh-HK';
        if (voice) utter.voice = voice;
        utter.rate = 0.92;
        utter.pitch = 1.0;

        utter.onend = () => {
          segIndex++;
          playNextSegment();
        };

        utter.onerror = () => {
          resetSpeechButtons();
        };

        window.speechSynthesis.speak(utter);
      }

      playNextSegment();
    }

    // ==================== EVENT LISTENERS ====================
    document.getElementById('play-anim-btn').addEventListener('click', startAutoAnimation);

    document.getElementById('next-stage-btn').addEventListener('click', () => {
      clearAutoAnim();
      if (currentStage < 5) {
        currentStage++;
        applyStageVisibility();
      }
    });

    document.getElementById('replay-btn').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      resetSpeechButtons();
      startAutoAnimation();
    });

    speakBtn.addEventListener('click', speakCurrentIdiom);

    pauseSpeakBtn.addEventListener('click', () => {
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        pauseSpeakBtn.textContent = '⏸ 暫停讀音';
      } else {
        window.speechSynthesis.pause();
        pauseSpeakBtn.textContent = '▶ 繼續讀音';
      }
    });

    stopSpeakBtn.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      resetSpeechButtons();
    });

    document.querySelectorAll('.stage-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        clearAutoAnim();
        currentStage = Number(btn.dataset.jumpStage);
        applyStageVisibility();
      });
    });

    document.querySelectorAll('.grp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        resetSpeechButtons();
        clearAutoAnim();

        currentGroup = btn.dataset.grp;
        document.querySelectorAll('.grp-btn').forEach(b => {
          b.className = 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600';
        });
        btn.className = 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-[#faf6ee] text-[#1c1917]';

        filteredIdioms = currentGroup === 'all'
          ? [...IDIOMS]
          : IDIOMS.filter(i => i.grp === currentGroup);

        currentIndex = 0;
        currentStage = 1;
        populateSelect();
        renderIdiom();
      });
    });

    idiomSelect.addEventListener('change', (e) => {
      window.speechSynthesis.cancel();
      resetSpeechButtons();
      clearAutoAnim();
      currentIndex = Number(e.target.value);
      currentStage = 1;
      renderIdiom();
    });

    document.getElementById('prev-idiom-btn').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      resetSpeechButtons();
      clearAutoAnim();
      currentIndex = (currentIndex - 1 + filteredIdioms.length) % filteredIdioms.length;
      currentStage = 1;
      renderIdiom();
    });

    document.getElementById('next-idiom-btn').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      resetSpeechButtons();
      clearAutoAnim();
      currentIndex = (currentIndex + 1) % filteredIdioms.length;
      currentStage = 1;
      renderIdiom();
    });

    // Preload voices on Chrome/Safari
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => getCantoneseVoice();
    }

    // Init
    populateSelect();
    renderIdiom();
  </script>
</body>
</html>
