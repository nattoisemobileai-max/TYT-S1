  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: #f7f3ea;
      color: #1c1917;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    /* Stage 1: Character Pop-in */
    @keyframes charPop {
      0% { opacity: 0; transform: scale(0.55) translateY(16px); }
      70% { opacity: 1; transform: scale(1.06) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .char-pop {
      animation: charPop 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* Stage 2: Red Hand-Drawn Circle SVG */
    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }
    .red-circle-stroke {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: drawCircle 0.75s ease-out forwards;
    }
    /* Stage 3-5: Reveal Slide-Up */
    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .reveal-up {
      animation: revealUp 0.45s ease-out forwards;
    }
    /* Highlight sweep */
    @keyframes highlightSweep {
      0% { background-size: 0% 100%; }
      100% { background-size: 100% 100%; }
    }
    .marker-highlight {
      background-image: linear-gradient(120deg, #fde68a 0%, #fcd34d 100%);
      background-repeat: no-repeat;
      background-position: 0 85%;
      background-size: 100% 42%;
      padding: 0 3px;
      border-radius: 3px;
    }
    /* Tian-zi-ge calligraphy box */
    .tianzige {
      background-image:
        linear-gradient(to right, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%),
        linear-gradient(to bottom, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%);
    }
    .speaking-circle {
      box-shadow: 0 0 0 4px #2563eb, 0 10px 25px -5px rgba(37, 99, 235, 0.28);
      border-color: #2563eb !important;
      border-radius: 1rem;
      transform: scale(1.01);
      transition: all 0.28s ease;
    }
  </style>

    // ==================== STATE ====================
    let filteredList = [...IDIOMS];
    let currentIndex = 0;
    let currentStage = 1; // 1 to 5

    let isSpeechPaused = false;
    let speechQueue = [];
    let speechQueueIdx = 0;
    let speechSessionId = 0;
    let cachedVoices = [];
    window.__activeUtterance = null;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      cachedVoices = window.speechSynthesis.getVoices() || [];
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickBestChineseVoice() {
      const voices = cachedVoices.length ? cachedVoices : (window.speechSynthesis.getVoices() || []);
      return (
        voices.find(v => /zh[-_]HK/i.test(v.lang) && /cantonese|粵|sinji|hiu|wan|ting/i.test(v.name)) ||
        voices.find(v => /zh[-_]HK|yue/i.test(v.lang)) ||
        voices.find(v => /cantonese|廣東話|粵語/i.test(v.name)) ||
        voices.find(v => /zh[-_]TW|zh[-_]CN|^zh/i.test(v.lang)) ||
        null
      );
    }

    function clearSpeakingSection() {
      document.querySelectorAll('.speaking-circle').forEach(el => el.classList.remove('speaking-circle'));
    }

    function highlightSpeakingSection(targetId) {
      clearSpeakingSection();
      if (!targetId) return;
      const el = document.getElementById(targetId);
      if (el) {
        el.classList.add('speaking-circle');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function resetSpeechControls() {
      clearSpeakingSection();
      isSpeechPaused = false;
      speechQueue = [];
      speechQueueIdx = 0;
      window.__activeUtterance = null;
      const pauseBtn = document.getElementById('pause-speak-btn');
      const stopBtn = document.getElementById('stop-speak-btn');
      pauseBtn.classList.add('hidden');
      stopBtn.classList.add('hidden');
      pauseBtn.textContent = '⏸ 暫停讀音';
    }

    function stopSpeech() {
      speechSessionId++;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetSpeechControls();
    }

    function speakNextChunk(sessionId) {
      if (sessionId !== speechSessionId || isSpeechPaused) return;
      if (speechQueueIdx >= speechQueue.length) {
        resetSpeechControls();
        return;
      }

      const chunk = speechQueue[speechQueueIdx];
      const text = typeof chunk === 'string' ? chunk : chunk.text;
      const targetId = typeof chunk === 'string' ? null : chunk.targetId;
      highlightSpeakingSection(targetId);
      const u = new SpeechSynthesisUtterance(text);
      const bestVoice = pickBestChineseVoice();
      if (bestVoice) {
        u.voice = bestVoice;
        u.lang = bestVoice.lang;
      } else {
        u.lang = 'zh-HK';
      }
      u.rate = 0.95;
      u.volume = 1.0;

      // Prevent Chrome GC from collecting utterance mid-speech
      window.__activeUtterance = u;

      u.onend = () => {
        if (sessionId !== speechSessionId || isSpeechPaused) return;
        speechQueueIdx++;
        speakNextChunk(sessionId);
      };
      u.onerror = () => {
        if (sessionId !== speechSessionId) return;
        resetSpeechControls();
      };

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      window.speechSynthesis.speak(u);
    }

    function speakIdiom() {
      if (!('speechSynthesis' in window)) {
        document.getElementById('typo-alert-card').textContent = '此瀏覽器不支援語音朗讀功能。';
        return;
      }

      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        document.getElementById('play-anim-btn').textContent = '▶ 自動播放動畫';
      }
      if (currentStage < 5) {
        renderIdiom(5);
      }

      const item = filteredList[currentIndex];
      const wasActive = window.speechSynthesis.speaking || window.speechSynthesis.pending || window.speechSynthesis.paused;
      speechSessionId++;
      const mySession = speechSessionId;
      window.speechSynthesis.cancel();

      isSpeechPaused = false;
      speechQueue = [
        { text: item.word, targetId: 'chars-stage' },
        { text: `辨義：${item.morphemes}`, targetId: 'colloc-morphemes' }
      ];
      if (item.syn && item.syn.length) {
        speechQueue.push({ text: `近義詞：${item.syn.join('、')}`, targetId: 'colloc-syn' });
      }
      if (item.ant && item.ant.length) {
        speechQueue.push({ text: `反義詞：${item.ant.join('、')}`, targetId: 'colloc-ant' });
      }
      speechQueue.push(
        { text: `解釋：${item.meaning}`, targetId: 'meaning-box' },
        { text: `用法：${item.sentiment}，${item.target}`, targetId: 'usage-box' },
        { text: `例句：${item.example}`, targetId: 'example-image-content' },
        { text: `複句造句：${item.complexSentence}`, targetId: 'complex-sentence-box' }
      );
      speechQueueIdx = 0;

      const pauseBtn = document.getElementById('pause-speak-btn');
      const stopBtn = document.getElementById('stop-speak-btn');
      pauseBtn.textContent = '⏸ 暫停讀音';
      pauseBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');

      // Delay slightly after cancel() to avoid Chromium cancel+speak race condition
      setTimeout(() => speakNextChunk(mySession), wasActive ? 90 : 20);

        // Highlight both the idiom (blue) and complex-sentence connectives (purple)
        const connRegex = /(雖然|儘管|因為|由於|既然|只要|如果|即使|不但|不僅|為了|直到|但是|然而|可是|所以|因此|只好|反而|依然|仍然|而且|並且|結果|否則|偏偏|還是|只好|卻|但|也|就|才|便)/g;
        const idiomRegex = new RegExp(wordPattern, 'g');

        `;
      } else {
        s5Box.classList.add('hidden');
      }

      updateStagePills();
    }

    // ==================== ANIMATION LOOP ====================
    function stopAutoPlay() {
      stopSpeech();
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      document.getElementById('play-anim-btn').textContent = '▶ 自動播放動畫';
    }

    document.getElementById('play-anim-btn').addEventListener('click', () => {
      if (autoTimer) {
        stopAutoPlay();
        return;
      }
      if (currentStage >= 5) renderIdiom(1);
      document.getElementById('play-anim-btn').textContent = '⏸ 暫停動畫';
      autoTimer = setInterval(() => {
        if (currentStage < 5) {
          renderIdiom(currentStage + 1);
        } else {
          stopAutoPlay();
        }
      }, 1350);
    });

    document.getElementById('next-stage-btn').addEventListener('click', () => {
      stopAutoPlay();
      if (currentStage < 5) renderIdiom(currentStage + 1);
      else if (currentIndex < filteredList.length - 1) {
        currentIndex++;
        renderIdiom(1);
      }
    });

    document.getElementById('replay-btn').addEventListener('click', () => {
      stopAutoPlay();
      renderIdiom(1);
      document.getElementById('play-anim-btn').click();
    });

    document.querySelectorAll('.stage-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        stopAutoPlay();
        renderIdiom(parseInt(btn.dataset.jumpStage, 10));
      });
    });

    // ==================== 40-IDIOM SUPER LARGE SLIDESHOW ====================
    let ssIdx = 0;
    let ssState = 'stopped'; // 'playing' | 'paused' | 'stopped'
    let ssTimer = null;
    let ssSessionId = 0;
    window.__ssUtterance = null;

    function renderSlideshowCard() {
      const item = IDIOMS[ssIdx];
      document.getElementById('ss-counter').textContent = `第 ${ssIdx + 1} / ${IDIOMS.length} 個`;
      document.getElementById('ss-page').textContent = item.page;
      document.getElementById('ss-meaning').textContent = item.meaning;

      document.getElementById('ss-chars').innerHTML = item.word.split('').map((ch, idx) => {
        const hasTypo = item.typoIdx && item.typoIdx.includes(idx);
        const pronText = item.pron[idx];
        return `
          <div class="relative flex flex-col items-center w-full">
            ${pronText ? `<span class="mb-2 text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 whitespace-nowrap">讀：${pronText}</span>` : `<span class="mb-2 h-6 sm:h-7"></span>`}
            <div class="relative w-full aspect-square max-w-[190px] rounded-3xl border-2 border-[#d6c9b2] bg-[#faf6ee] tianzige flex items-center justify-center shadow-md char-pop" style="animation-delay: ${idx * 70}ms">
              <span class="font-serif-tc font-black text-[clamp(3.2rem,13vw,7.2rem)] leading-none ${hasTypo ? 'text-[#b91c1c]' : 'text-[#1c1917]'} select-none">${ch}</span>
              ${hasTypo ? `
                <svg viewBox="0 0 120 120" class="absolute inset-0 w-full h-full pointer-events-none">
                  <ellipse cx="60" cy="60" rx="50" ry="48" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" class="red-circle-stroke" style="animation-delay: ${idx * 90 + 220}ms" />
                </svg>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      const typoBox = document.getElementById('ss-typo-note');
      if (item.typoNote) {
        typoBox.classList.remove('hidden');
        typoBox.innerHTML = `<div class="reveal-up rounded-2xl px-4 py-2.5 border-2 bg-red-50 border-red-300 text-red-900 text-sm sm:text-base font-bold">⭕ 正字提醒：${item.typoNote}</div>`;
      } else {
        typoBox.classList.add('hidden');
        typoBox.innerHTML = '';
      }
    }

    function updateSlideshowButtons() {
      const playBtn = document.getElementById('ss-play-btn');
      const pauseBtn = document.getElementById('ss-pause-btn');
      const statusEl = document.getElementById('ss-status');
      if (ssState === 'playing') {
        playBtn.classList.add('opacity-50');
        pauseBtn.textContent = '⏸ Pause 暫停';
        statusEl.textContent = '🔊 正在順序播放及朗讀…';
      } else if (ssState === 'paused') {
        playBtn.classList.remove('opacity-50');
        pauseBtn.textContent = '▶ 繼續播放';
        statusEl.textContent = '⏸ 已暫停';
      } else {
        playBtn.classList.remove('opacity-50');
        pauseBtn.textContent = '⏸ Pause 暫停';
        statusEl.textContent = '⏹ 已停止｜點擊 Play 開始連播';
      }
    }

    function speakAndAdvanceSlideshow(mySession) {
      if (mySession !== ssSessionId || ssState !== 'playing') return;
      renderSlideshowCard();

      const item = IDIOMS[ssIdx];
      const advanceNext = () => {
        if (mySession !== ssSessionId || ssState !== 'playing') return;
        const delayMs = parseInt(document.getElementById('ss-delay-select').value, 10) || 3000;
        let remainSec = Math.ceil(delayMs / 1000);
        const statusEl = document.getElementById('ss-status');
        statusEl.textContent = `⏳ 停頓 ${remainSec} 秒後切換下一個…`;

        const tickId = setInterval(() => {
          if (mySession !== ssSessionId || ssState !== 'playing') {
            clearInterval(tickId);
            return;
          }
          remainSec--;
          if (remainSec > 0) {
            statusEl.textContent = `⏳ 停頓 ${remainSec} 秒後切換下一個…`;
          } else {
            clearInterval(tickId);
          }
        }, 1000);

        ssTimer = setTimeout(() => {
          clearInterval(tickId);
          if (mySession !== ssSessionId || ssState !== 'playing') return;
          const loopOn = document.getElementById('ss-loop-cb').checked;
          if (ssIdx < IDIOMS.length - 1) {
            ssIdx++;
            speakAndAdvanceSlideshow(mySession);
          } else if (loopOn) {
            ssIdx = 0;
            speakAndAdvanceSlideshow(mySession);
          } else {
            ssState = 'stopped';
            updateSlideshowButtons();
          }
        }, delayMs);
      };

      if (!('speechSynthesis' in window)) {
        ssTimer = setTimeout(advanceNext, 2200);
        return;
      }

      const u = new SpeechSynthesisUtterance(item.word);
      const bestVoice = pickBestChineseVoice();
      if (bestVoice) {
        u.voice = bestVoice;
        u.lang = bestVoice.lang;
      } else {
        u.lang = 'zh-HK';
      }
      u.rate = 0.9;
      u.volume = 1.0;
      window.__ssUtterance = u;

      u.onend = advanceNext;
      u.onerror = advanceNext;

      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    }

    function startSlideshow() {
      clearTimeout(ssTimer);
      if (ssState === 'paused') {
        ssState = 'playing';
        updateSlideshowButtons();
        if ('speechSynthesis' in window && window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        } else {
          ssSessionId++;
          speakAndAdvanceSlideshow(ssSessionId);
        }
        return;
      }
      ssState = 'playing';
      updateSlideshowButtons();
      ssSessionId++;
      const mySession = ssSessionId;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      setTimeout(() => speakAndAdvanceSlideshow(mySession), 80);
    }

    function pauseSlideshow() {
      if (ssState === 'playing') {
        ssState = 'paused';
        clearTimeout(ssTimer);
        if ('speechSynthesis' in window) window.speechSynthesis.pause();
        updateSlideshowButtons();
      } else if (ssState === 'paused') {
        startSlideshow();
      }
    }

    function stopSlideshow() {
      ssState = 'stopped';
      ssSessionId++;
      clearTimeout(ssTimer);
      window.__ssUtterance = null;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      updateSlideshowButtons();
    }

    document.getElementById('slideshow-tag-btn').addEventListener('click', () => {
      stopAutoPlay();
      document.getElementById('detail-panel').classList.add('hidden');
      document.getElementById('slideshow-panel').classList.remove('hidden');
      document.querySelectorAll('.grp-btn').forEach(b => {
        b.className = 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600';
      });
      document.getElementById('slideshow-tag-btn').className = 'px-3 py-1 rounded-md text-xs font-bold bg-[#faf6ee] text-[#1c1917] ring-2 ring-amber-400 transition shadow-sm';
      renderSlideshowCard();
      updateSlideshowButtons();
    });

    document.getElementById('ss-play-btn').addEventListener('click', startSlideshow);
    document.getElementById('ss-pause-btn').addEventListener('click', pauseSlideshow);
    document.getElementById('ss-stop-btn').addEventListener('click', stopSlideshow);
    document.getElementById('ss-prev-btn').addEventListener('click', () => {
      stopSlideshow();
      ssIdx = (ssIdx - 1 + IDIOMS.length) % IDIOMS.length;
      renderSlideshowCard();
    });
    document.getElementById('ss-next-btn').addEventListener('click', () => {
      stopSlideshow();
      ssIdx = (ssIdx + 1) % IDIOMS.length;
      renderSlideshowCard();
    });

    // ==================== NAVIGATION ====================
    document.querySelectorAll('.grp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        stopSlideshow();
        document.getElementById('slideshow-panel').classList.add('hidden');
        document.getElementById('detail-panel').classList.remove('hidden');
        document.getElementById('slideshow-tag-btn').className = 'px-3 py-1 rounded-md text-xs font-bold bg-amber-500 hover:bg-amber-400 text-stone-950 transition shadow-sm';
        stopAutoPlay();
        const grp = btn.dataset.grp;
        filteredList = grp === 'all' ? [...IDIOMS] : IDIOMS.filter(x => x.grp === grp);
        currentIndex = 0;

        document.querySelectorAll('.grp-btn').forEach(b => {
          b.className = b === btn
            ? 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-[#faf6ee] text-[#1c1917]'
            : 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600';
        });
        populateSelect();
        renderIdiom(1);
      });
    });

    document.getElementById('idiom-select').addEventListener('change', e => {
      stopAutoPlay();
      currentIndex = parseInt(e.target.value, 10);
      renderIdiom(1);
    });

    document.getElementById('prev-idiom-btn').addEventListener('click', () => {
      stopAutoPlay();
      currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      renderIdiom(1);
    });

    document.getElementById('next-idiom-btn').addEventListener('click', () => {
      stopAutoPlay();
      currentIndex = (currentIndex + 1) % filteredList.length;
      renderIdiom(1);
    });

    // ==================== AUTO-MINIMIZE HEADER ON SCROLL ====================
    let isHeaderMinimized = false;
    let lastScrollY = window.scrollY || 0;

    function setHeaderMinimized(min) {
      if (isHeaderMinimized === min) return;
      isHeaderMinimized = min;
      const collapsible = document.getElementById('header-collapsible');
      const inner = document.getElementById('header-inner');
      const sub = document.getElementById('header-subtitle');
      const logo = document.getElementById('header-logo');
      const toggleBtn = document.getElementById('toggle-menu-btn');

      if (min) {
        collapsible.classList.add('hidden');
        sub.classList.add('hidden');
        inner.classList.remove('py-3', 'space-y-2.5');
        inner.classList.add('py-1.5');
        logo.classList.remove('w-9', 'h-9', 'text-lg');
        logo.classList.add('w-7', 'h-7', 'text-sm');
        toggleBtn.textContent = '▼ 展開選單';
      } else {
        collapsible.classList.remove('hidden');
        sub.classList.remove('hidden');
        inner.classList.add('py-3', 'space-y-2.5');
        inner.classList.remove('py-1.5');
        logo.classList.add('w-9', 'h-9', 'text-lg');
        logo.classList.remove('w-7', 'h-7', 'text-sm');
        toggleBtn.textContent = '▲ 收合選單';
      }
    }

    document.getElementById('toggle-menu-btn').addEventListener('click', () => {
      setHeaderMinimized(!isHeaderMinimized);
    });

    window.addEventListener('scroll', () => {
      const currY = window.scrollY || document.documentElement.scrollTop || 0;
      const delta = currY - lastScrollY;
      if (currY <= 35) {
        setHeaderMinimized(false);
      } else if (delta > 8 && currY > 70) {
        setHeaderMinimized(true);
      } else if (delta < -10) {
        setHeaderMinimized(false);
      }
      lastScrollY = currY;
    }, { passive: true });

    // Init: start with stage 1 and auto-play the first idiom's animation!
    populateSelect();
    renderIdiom(1);
    setTimeout(() => document.getElementById('play-anim-btn').click(), 350);
  </script>
</body>
</html>
