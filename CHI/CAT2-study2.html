<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成語動畫學習室｜逐個動畫學成語</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: #f7f3ea;
      color: #1c1917;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    /* Stage 1: Character Pop-in */
    @keyframes charPop {
      0% { opacity: 0; transform: scale(0.55) translateY(16px); }
      70% { opacity: 1; transform: scale(1.06) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .char-pop {
      animation: charPop 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* Stage 2: Red Hand-Drawn Circle SVG */
    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }
    .red-circle-stroke {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: drawCircle 0.75s ease-out forwards;
    }
    /* Stage 3-5: Reveal Slide-Up */
    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .reveal-up {
      animation: revealUp 0.45s ease-out forwards;
    }
    /* Highlight sweep */
    @keyframes highlightSweep {
      0% { background-size: 0% 100%; }
      100% { background-size: 100% 100%; }
    }
    .marker-highlight {
      background-image: linear-gradient(120deg, #fde68a 0%, #fcd34d 100%);
      background-repeat: no-repeat;
      background-position: 0 85%;
      background-size: 100% 42%;
      padding: 0 3px;
      border-radius: 3px;
    }
    /* Tian-zi-ge calligraphy box */
    .tianzige {
      background-image:
        linear-gradient(to right, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%),
        linear-gradient(to bottom, transparent 49.5%, #e7decb 49.5%, #e7decb 50.5%, transparent 50.5%);
    }
    .speaking-circle {
      box-shadow: 0 0 0 4px #2563eb, 0 10px 25px -5px rgba(37, 99, 235, 0.28);
      border-color: #2563eb !important;
      border-radius: 1rem;
      transform: scale(1.01);
      transition: all 0.28s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Control Header -->
  <header class="bg-[#1c1917] text-[#faf6ee] border-b-4 border-[#b91c1c] sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-lg bg-[#b91c1c] flex items-center justify-center font-serif-tc font-black text-lg">詞</span>
          <div>
            <h1 class="font-serif-tc text-base sm:text-lg font-bold leading-tight">成語動畫學習室</h1>
            <p class="text-[11px] text-[#d6cbb7]">逐字放大 · 紅圈正字 · 詞語高亮 · 解釋用法 · 例句配圖</p>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <button id="play-anim-btn" type="button" class="px-3.5 py-1.5 rounded-lg bg-[#b91c1c] hover:bg-[#991b1b] text-white text-xs sm:text-sm font-bold transition shadow">
            ▶ 自動播放動畫
          </button>
          <button id="next-stage-btn" type="button" class="px-3 py-1.5 rounded-lg bg-[#d97706] hover:bg-[#b45309] text-white text-xs sm:text-sm font-semibold transition">
            下一步動畫
          </button>
          <button id="replay-btn" type="button" class="px-3 py-1.5 rounded-lg bg-stone-700 hover:bg-stone-600 text-xs sm:text-sm font-medium transition">
            ↺ 重播本詞
          </button>
          <button id="speak-btn" type="button" class="px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-xs sm:text-sm font-medium transition">
            🔊 廣東話讀
          </button>
          <button id="pause-speak-btn" type="button" class="hidden px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-medium transition">
            ⏸ 暫停讀音
          </button>
          <button id="stop-speak-btn" type="button" class="hidden px-2.5 py-1.5 rounded-lg bg-rose-700 hover:bg-rose-600 text-white text-xs sm:text-sm font-medium transition">
            ⏹ 停止
          </button>
        </div>
      </div>

      <!-- Group Tabs -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-stone-700">
        <div class="flex flex-wrap gap-1.5" id="group-tabs">
          <button type="button" data-grp="all" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-[#faf6ee] text-[#1c1917]">全部 (40)</button>
          <button type="button" data-grp="p14_15" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600">P14-15</button>
          <button type="button" data-grp="p16_17" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600">P16-17</button>
          <button type="button" data-grp="p18_19" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600">P18-19</button>
          <button type="button" data-grp="p20_21" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600">P20-21</button>
          <button type="button" data-grp="p22_23" class="grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600">P22-23</button>
        </div>

        <div class="flex items-center gap-2">
          <button id="prev-idiom-btn" type="button" class="px-2.5 py-1 rounded-md bg-stone-700 hover:bg-stone-600 text-xs font-semibold">← 上一個</button>
          <select id="idiom-select" aria-label="選擇成語" class="bg-stone-800 text-white border border-stone-600 rounded-md px-2 py-1 text-xs"></select>
          <button id="next-idiom-btn" type="button" class="px-2.5 py-1 rounded-md bg-stone-700 hover:bg-stone-600 text-xs font-semibold">下一個 →</button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-5">

    <!-- 5-Stage Progress Indicator -->
    <div class="grid grid-cols-5 gap-1.5 text-center text-[11px] sm:text-xs font-semibold">
      <button type="button" data-jump-stage="1" class="stage-pill py-1.5 px-1 rounded-xl border transition">① 超大成語</button>
      <button type="button" data-jump-stage="2" class="stage-pill py-1.5 px-1 rounded-xl border transition">② 紅圈錯別字</button>
      <button type="button" data-jump-stage="3" class="stage-pill py-1.5 px-1 rounded-xl border transition">③ 高亮配詞</button>
      <button type="button" data-jump-stage="4" class="stage-pill py-1.5 px-1 rounded-xl border transition">④ 解釋與用法</button>
      <button type="button" data-jump-stage="5" class="stage-pill py-1.5 px-1 rounded-xl border transition">⑤ 例句與圖片</button>
    </div>

    <!-- Main Stage Card -->
    <section class="bg-[#fffdf8] border-2 border-[#e5dccb] rounded-3xl p-5 sm:p-8 shadow-sm space-y-6">

      <!-- STAGE 1 & 2: SUPER LARGE IDIOM + RED CIRCLE FOR TYPOS -->
      <div class="text-center space-y-4">
        <div class="flex items-center justify-center gap-2 text-xs text-stone-500 font-semibold">
          <span id="idiom-index-badge" class="px-2.5 py-0.5 rounded-full bg-stone-200 text-stone-700">第 1 / 36 個</span>
          <span id="idiom-page-badge" class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900">P.14</span>
        </div>

        <!-- 4 Super Large Characters -->
        <div id="chars-stage" class="grid grid-cols-4 gap-2 sm:gap-4 max-w-2xl mx-auto py-2 items-end">
          <!-- Rendered by JS -->
        </div>

        <!-- Stage 2: Red Typo Alert Banner -->
        <div id="stage-2-box" class="hidden max-w-xl mx-auto">
          <div id="typo-alert-card" class="reveal-up rounded-2xl px-4 py-3 border text-sm font-medium"></div>
        </div>
      </div>

      <!-- STAGE 3: HIGHLIGHT COLLOCATIONS (辨義 + 近義詞 + 反義詞) -->
      <div id="stage-3-box" class="hidden reveal-up border-t border-[#efe7d8] pt-5 space-y-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-5 rounded-full bg-amber-500"></span>
          <h2 class="font-serif-tc font-bold text-lg sm:text-xl text-stone-900">搭配詞語與詞素高亮</h2>
        </div>
        <div id="collocations-content" class="grid sm:grid-cols-3 gap-3.5 text-base sm:text-lg"></div>
      </div>

      <!-- STAGE 4: EXPLANATION & USAGE -->
      <div id="stage-4-box" class="hidden reveal-up border-t border-[#efe7d8] pt-5 space-y-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-5 rounded-full bg-[#b91c1c]"></span>
          <h2 class="font-serif-tc font-bold text-lg sm:text-xl text-stone-900">解釋（析義）與用法</h2>
        </div>
        <div id="meaning-usage-content" class="grid sm:grid-cols-12 gap-3 text-sm"></div>
      </div>

      <!-- STAGE 5: EXAMPLE SENTENCE + ILLUSTRATION -->
      <div id="stage-5-box" class="hidden reveal-up border-t border-[#efe7d8] pt-5 space-y-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-5 rounded-full bg-emerald-600"></span>
          <h2 class="font-serif-tc font-bold text-lg sm:text-xl text-stone-900">例句與情境圖片</h2>
        </div>
        <div id="example-image-content" class="grid md:grid-cols-12 gap-4 items-center bg-[#faf6ee] border border-[#e5dccb] rounded-2xl p-4"></div>
      </div>

    </section>

  </main>

      const stopBtn = document.getElementById('stop-speak-btn');
      pauseBtn.classList.add('hidden');
      stopBtn.classList.add('hidden');
      pauseBtn.textContent = '⏸ 暫停讀音';
    }

    function stopSpeech() {
      speechSessionId++;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetSpeechControls();
    }

    function speakNextChunk(sessionId) {
      if (sessionId !== speechSessionId || isSpeechPaused) return;
      if (speechQueueIdx >= speechQueue.length) {
        resetSpeechControls();
        return;
      }

      const chunk = speechQueue[speechQueueIdx];
      const text = typeof chunk === 'string' ? chunk : chunk.text;
      const targetId = typeof chunk === 'string' ? null : chunk.targetId;
      highlightSpeakingSection(targetId);
      const u = new SpeechSynthesisUtterance(text);
      const bestVoice = pickBestChineseVoice();
      if (bestVoice) {
        u.voice = bestVoice;
        u.lang = bestVoice.lang;
      } else {
        u.lang = 'zh-HK';
      }
      u.rate = 0.95;
      u.volume = 1.0;

      // Prevent Chrome GC from collecting utterance mid-speech
      window.__activeUtterance = u;

      u.onend = () => {
        if (sessionId !== speechSessionId || isSpeechPaused) return;
        speechQueueIdx++;
        speakNextChunk(sessionId);
      };
      u.onerror = () => {
        if (sessionId !== speechSessionId) return;
        resetSpeechControls();
      };

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      window.speechSynthesis.speak(u);
    }

    function speakIdiom() {
      if (!('speechSynthesis' in window)) {
        document.getElementById('typo-alert-card').textContent = '此瀏覽器不支援語音朗讀功能。';
        return;
      }

      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        document.getElementById('play-anim-btn').textContent = '▶ 自動播放動畫';
      }
      if (currentStage < 5) {
        renderIdiom(5);
      }

      const item = filteredList[currentIndex];
      const wasActive = window.speechSynthesis.speaking || window.speechSynthesis.pending || window.speechSynthesis.paused;
      speechSessionId++;
      const mySession = speechSessionId;
      window.speechSynthesis.cancel();

      isSpeechPaused = false;
      speechQueue = [
        { text: item.word, targetId: 'chars-stage' },
        { text: `辨義：${item.morphemes}`, targetId: 'colloc-morphemes' }
      ];
      if (item.syn && item.syn.length) {
        speechQueue.push({ text: `近義詞：${item.syn.join('、')}`, targetId: 'colloc-syn' });
      }
      if (item.ant && item.ant.length) {
        speechQueue.push({ text: `反義詞：${item.ant.join('、')}`, targetId: 'colloc-ant' });
      }
      speechQueue.push(
        { text: `解釋：${item.meaning}`, targetId: 'meaning-box' },
        { text: `用法：${item.sentiment}，${item.target}`, targetId: 'usage-box' },
        { text: `例句：${item.example}`, targetId: 'example-image-content' }
      );
      speechQueueIdx = 0;

      const pauseBtn = document.getElementById('pause-speak-btn');
      const stopBtn = document.getElementById('stop-speak-btn');
      pauseBtn.textContent = '⏸ 暫停讀音';
      pauseBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');

      // Delay slightly after cancel() to avoid Chromium cancel+speak race condition
      setTimeout(() => speakNextChunk(mySession), wasActive ? 90 : 20);
    }

    document.getElementById('speak-btn').addEventListener('click', speakIdiom);
    document.getElementById('pause-speak-btn').addEventListener('click', () => {
      if (!('speechSynthesis' in window)) return;
      const pauseBtn = document.getElementById('pause-speak-btn');
      if (!isSpeechPaused) {
        isSpeechPaused = true;
        window.speechSynthesis.pause();
        pauseBtn.textContent = '▶ 繼續讀音';
      } else {
        isSpeechPaused = false;
        pauseBtn.textContent = '⏸ 暫停讀音';
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        } else {
          speakNextChunk(speechSessionId);
        }
      }
    });
    document.getElementById('stop-speak-btn').addEventListener('click', stopSpeech);

    // ==================== RENDER ====================
    function populateSelect() {
      const sel = document.getElementById('idiom-select');
      sel.innerHTML = filteredList.map((item, i) =>
        `<option value="${i}">${item.id}. ${item.word}</option>`
      ).join('');
      sel.value = currentIndex;
    }

    function updateStagePills() {
      document.querySelectorAll('.stage-pill').forEach(btn => {
        const s = parseInt(btn.dataset.jumpStage, 10);
        if (s === currentStage) {
          btn.className = 'stage-pill py-1.5 px-1 rounded-xl border bg-[#b91c1c] text-white border-[#b91c1c] font-bold shadow-sm transition';
        } else if (s < currentStage) {
          btn.className = 'stage-pill py-1.5 px-1 rounded-xl border bg-emerald-50 text-emerald-800 border-emerald-300 font-semibold transition';
        } else {
          btn.className = 'stage-pill py-1.5 px-1 rounded-xl border bg-white text-stone-500 border-stone-200 hover:bg-stone-50 transition';
        }
      });
    }

    function renderIdiom(stage = 1) {
      currentStage = stage;
      const item = filteredList[currentIndex];
      document.getElementById('idiom-select').value = currentIndex;
      document.getElementById('idiom-index-badge').textContent = `第 ${currentIndex + 1} / ${filteredList.length} 個`;
      document.getElementById('idiom-page-badge').textContent = item.page;

      // Stage 1: Super Large Characters + Stage 2: Red SVG Circle on Typo Characters
      const charsStage = document.getElementById('chars-stage');
      charsStage.innerHTML = item.word.split('').map((ch, idx) => {
        const hasTypo = currentStage >= 2 && item.typoIdx.includes(idx);
        const pronText = item.pron[idx];
        return `
          <div class="relative flex flex-col items-center w-full">
            ${pronText ? `<span class="mb-1.5 text-xs sm:text-sm font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 whitespace-nowrap">讀：${pronText}</span>` : `<span class="mb-1.5 h-6 sm:h-7"></span>`}
            <div class="relative w-full aspect-square max-w-[140px] rounded-2xl border-2 border-[#d6c9b2] bg-[#faf6ee] tianzige flex items-center justify-center shadow-sm char-pop" style="animation-delay: ${idx * 90}ms">
              <span class="font-serif-tc font-black text-[clamp(2.4rem,9vw,5.2rem)] leading-none ${hasTypo ? 'text-[#b91c1c]' : 'text-[#1c1917]'} select-none">${ch}</span>
              ${hasTypo ? `
                <svg viewBox="0 0 120 120" class="absolute inset-0 w-full h-full pointer-events-none">
                  <ellipse cx="60" cy="60" rx="50" ry="48" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" class="red-circle-stroke" />
                </svg>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      // Stage 2: Typo Note
      const s2Box = document.getElementById('stage-2-box');
      const typoCard = document.getElementById('typo-alert-card');
      if (currentStage >= 2) {
        s2Box.classList.remove('hidden');
        if (item.typoNote) {
          typoCard.className = 'reveal-up rounded-2xl px-5 py-3.5 border-2 bg-red-50 border-red-300 text-red-900 text-base sm:text-lg font-bold';
          typoCard.textContent = '⭕ 易錯別字提醒：' + item.typoNote;
        } else {
          typoCard.className = 'reveal-up rounded-2xl px-5 py-3.5 border bg-emerald-50 border-emerald-200 text-emerald-800 text-base font-semibold';
          typoCard.textContent = '✓ 此成語在課本中沒有特別標註易錯別字。';
        }
      } else {
        s2Box.classList.add('hidden');
      }

      // Stage 3: Highlighted Collocations (辨義 + 近義詞 + 反義詞)
      const s3Box = document.getElementById('stage-3-box');
      if (currentStage >= 3) {
        s3Box.classList.remove('hidden');
        const synHtml = item.syn.length
          ? item.syn.map(w => `<span class="inline-block px-3 py-1 rounded-lg bg-emerald-100 text-emerald-900 font-bold text-base sm:text-lg border border-emerald-300">${w}</span>`).join(' ')
          : '<span class="text-stone-400 text-base">（課本未列）</span>';
        const antHtml = item.ant.length
          ? item.ant.map(w => `<span class="inline-block px-3 py-1 rounded-lg bg-indigo-100 text-indigo-900 font-bold text-base sm:text-lg border border-indigo-300">${w}</span>`).join(' ')
          : '<span class="text-stone-400 text-base">（課本未列）</span>';

        document.getElementById('collocations-content').innerHTML = `
          <div id="colloc-morphemes" class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200 space-y-1.5 transition-all">
            <div class="text-sm font-bold text-amber-900">✨ 字詞辨義（高亮重點）</div>
            <div class="text-stone-800 leading-relaxed"><span class="marker-highlight font-semibold">${item.morphemes}</span></div>
          </div>
          <div id="colloc-syn" class="p-3.5 rounded-xl bg-emerald-50/60 border border-emerald-200 space-y-1.5 transition-all">
            <div class="text-sm font-bold text-emerald-900">🔗 近義詞配對</div>
            <div class="flex flex-wrap gap-1.5">${synHtml}</div>
          </div>
          <div id="colloc-ant" class="p-3.5 rounded-xl bg-indigo-50/60 border border-indigo-200 space-y-1.5 transition-all">
            <div class="text-sm font-bold text-indigo-900">🔄 反義詞配對</div>
            <div class="flex flex-wrap gap-1.5">${antHtml}</div>
          </div>
        `;
      } else {
        s3Box.classList.add('hidden');
      }

      // Stage 4: Explanation & Usage
      const s4Box = document.getElementById('stage-4-box');
      if (currentStage >= 4) {
        s4Box.classList.remove('hidden');
        const sentBadge = item.sentiment.includes('褒')
          ? 'bg-emerald-100 text-emerald-900 border-emerald-300'
          : item.sentiment.includes('貶')
          ? 'bg-red-100 text-red-900 border-red-300'
          : 'bg-sky-100 text-sky-900 border-sky-300';

        document.getElementById('meaning-usage-content').innerHTML = `
          <div id="meaning-box" class="sm:col-span-8 p-4 rounded-xl bg-[#faf6ee] border border-[#e5dccb] transition-all">
            <div class="text-sm font-bold text-stone-600 mb-1.5">【析義／解釋】</div>
            <p class="text-lg sm:text-xl font-semibold text-stone-900 leading-relaxed">${item.meaning}</p>
          </div>
          <div id="usage-box" class="sm:col-span-4 p-4 rounded-xl bg-[#faf6ee] border border-[#e5dccb] flex flex-col justify-center gap-2.5 transition-all">
            <div class="text-sm font-bold text-stone-600">【用法】</div>
            <div class="flex flex-wrap gap-2">
              <span class="px-3.5 py-1.5 rounded-full border text-sm sm:text-base font-bold ${sentBadge}">${item.sentiment}</span>
              <span class="px-3.5 py-1.5 rounded-full border bg-white border-stone-300 text-stone-800 text-sm sm:text-base font-bold">${item.target}</span>
            </div>
          </div>
        `;
      } else {
        s4Box.classList.add('hidden');
      }

      // Stage 5: Example Sentence + Picture
      const s5Box = document.getElementById('stage-5-box');
      if (currentStage >= 5) {
        s5Box.classList.remove('hidden');
        const wordPattern = item.word === '大相逕庭' ? '大相[逕徑]庭' : item.word;
        const highlightedSentence = item.example.replace(
          new RegExp(wordPattern, 'g'),
          m => `<span class="font-bold text-[#b91c1c] bg-amber-100 px-1.5 py-0.5 rounded">${m}</span>`
        );
        const visualHtml = item.img
          ? `<img src="${item.img}" alt="${item.word}插畫" class="w-full h-52 sm:h-60 object-cover rounded-xl bg-white border border-[#e5dccb] shadow-sm" />`
          : `<div class="w-full h-52 sm:h-60 rounded-xl bg-gradient-to-br from-amber-50 to-stone-100 border border-[#e5dccb] flex flex-col items-center justify-center gap-2">
               <span class="text-6xl">${item.svgIcon || '📖'}</span>
               <span class="font-serif-tc font-bold text-base text-stone-700">${item.word}</span>
             </div>`;

        document.getElementById('example-image-content').innerHTML = `
          <div class="md:col-span-7 space-y-2.5">
            <div class="text-sm font-bold text-emerald-800">【例句】</div>
            <p class="text-lg sm:text-2xl font-medium leading-relaxed text-stone-900">${highlightedSentence}</p>
          </div>
          <div class="md:col-span-5">${visualHtml}</div>
        `;
      } else {
        s5Box.classList.add('hidden');
      }

      updateStagePills();
    }

    // ==================== ANIMATION LOOP ====================
    function stopAutoPlay() {
      stopSpeech();
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      document.getElementById('play-anim-btn').textContent = '▶ 自動播放動畫';
    }

    document.getElementById('play-anim-btn').addEventListener('click', () => {
      if (autoTimer) {
        stopAutoPlay();
        return;
      }
      if (currentStage >= 5) renderIdiom(1);
      document.getElementById('play-anim-btn').textContent = '⏸ 暫停動畫';
      autoTimer = setInterval(() => {
        if (currentStage < 5) {
          renderIdiom(currentStage + 1);
        } else {
          stopAutoPlay();
        }
      }, 1350);
    });

    document.getElementById('next-stage-btn').addEventListener('click', () => {
      stopAutoPlay();
      if (currentStage < 5) renderIdiom(currentStage + 1);
      else if (currentIndex < filteredList.length - 1) {
        currentIndex++;
        renderIdiom(1);
      }
    });

    document.getElementById('replay-btn').addEventListener('click', () => {
      stopAutoPlay();
      renderIdiom(1);
      document.getElementById('play-anim-btn').click();
    });

    document.querySelectorAll('.stage-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        stopAutoPlay();
        renderIdiom(parseInt(btn.dataset.jumpStage, 10));
      });
    });

    // ==================== NAVIGATION ====================
    document.querySelectorAll('.grp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        stopAutoPlay();
        const grp = btn.dataset.grp;
        filteredList = grp === 'all' ? [...IDIOMS] : IDIOMS.filter(x => x.grp === grp);
        currentIndex = 0;

        document.querySelectorAll('.grp-btn').forEach(b => {
          b.className = b === btn
            ? 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-[#faf6ee] text-[#1c1917]'
            : 'grp-btn px-2.5 py-1 rounded-md text-xs font-semibold bg-stone-700 text-stone-200 hover:bg-stone-600';
        });
        populateSelect();
        renderIdiom(1);
      });
    });

    document.getElementById('idiom-select').addEventListener('change', e => {
      stopAutoPlay();
      currentIndex = parseInt(e.target.value, 10);
      renderIdiom(1);
    });

    document.getElementById('prev-idiom-btn').addEventListener('click', () => {
      stopAutoPlay();
      currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      renderIdiom(1);
    });

    document.getElementById('next-idiom-btn').addEventListener('click', () => {
      stopAutoPlay();
      currentIndex = (currentIndex + 1) % filteredList.length;
      renderIdiom(1);
    });

    // Init: start with stage 1 and auto-play the first idiom's animation!
    populateSelect();
    renderIdiom(1);
    setTimeout(() => document.getElementById('play-anim-btn').click(), 350);
  </script>
</body>
</html>
