<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小常識 · Selfnotes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e0ec 0%, #eaf0f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.5rem;
        }

        .notes-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 1rem 0.8rem;
            box-shadow: 0 20px 30px -10px rgba(0,40,60,0.4);
            border: 2px solid rgba(255,255,255,0.8);
        }

        .notes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 0 #bed0e3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .back-home {
            background: #f4d03f;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 1rem;
            color: #1f3a4b;
            border: none;
            box-shadow: 0 3px 0 #b38f1c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-home:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b38f1c;
        }

        .notes-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: #eef5ff;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #1a4972;
            border: 2px solid #c1d9f0;
        }

        .stats-badge {
            background: #2b3c4e;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 標籤列 */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: white;
            border: 2px solid #c1d9f0;
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f3a4b;
            box-shadow: 0 3px 0 #9fbad0;
            cursor: pointer;
            transition: 0.1s;
            flex: 0 1 auto;
            min-width: 100px;
        }
        .tab-btn.active {
            background: #3498db;
            color: white;
            border-color: #2c7bb6;
        }
        .tab-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9fbad0;
        }

        /* 圖片卡片 */
        .image-card {
            background: white;
            border-radius: 30px;
            padding: 1.5rem;
            box-shadow: 0 8px 0 #a0b9cf;
            border: 2px solid #fff6cf;
            display: none;
        }
        .image-card.active {
            display: block;
        }

        .image-wrapper {
            background: #f5faff;
            border-radius: 20px;
            padding: 1rem;
            border: 2px dashed #c1d9f0;
        }

        /* 多圖網格 */
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .image-grid-item {
            flex: 1 1 calc(50% - 0.5rem);
            min-width: 200px;
        }
        .image-grid-item img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .image-grid-item img:hover {
            transform: scale(1.02);
        }

        .image-caption {
            text-align: center;
            margin-top: 1rem;
            color: #4f6f8f;
            font-size: 1rem;
            font-style: italic;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b8baa;
            font-size: 0.9rem;
        }

        /* 手機微調 */
        @media (max-width: 480px) {
            .notes-header {
                flex-direction: column;
                align-items: stretch;
            }
            .tab-btn {
                font-size: 1rem;
                padding: 0.5rem 1rem;
            }
            .image-grid-item {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
<div class="notes-container">
    <!-- 頂部列 -->
    <div class="notes-header">
        <a href="../index-GS.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="notes-title">第五冊第1課·生物的分類</span>
        <span class="stats-badge"><i class="fas fa-star"></i> 圖片筆記</span>
    </div>

    <!-- 標籤按鈕 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="self">Self</button>
        <button class="tab-btn" data-tab="wave">Wave</button>
        <button class="tab-btn" data-tab="banana">Banana</button>
    </div>

    <!-- Self 標籤圖片（多張） -->
    <div class="image-card active" id="tab-self">
        <div class="image-wrapper">
            <div class="image-grid">
                <div class="image-grid-item">
                    <img src="images/img-5.1_self1.jpg" alt="self image 1">
                </div>
                <div class="image-grid-item">
                    <img src="images/img-5.1_self2.jpg" alt="self image 2">
                </div>
                <div class="image-grid-item">
                    <img src="images/img-5.1_self3.jpg" alt="self image 3">
                </div>
                <div class="image-grid-item">
                    <img src="images/img-5.1_self4.jpg" alt="self image 4">
                </div>
            </div>
        </div>
    </div>

    <!-- Wave 標籤圖片 -->
    <div class="image-card" id="tab-wave">
        <div class="image-wrapper">
            <img src="images/img-5.1_wave.jpg" alt="Wave image" style="width:100%; border-radius:16px;">
        </div>
        <div class="image-wrapper">
            <img src="images/img-5.1_wave2.jpg" alt="Wave image" style="width:100%; border-radius:16px;">
        </div>
    </div>

    <!-- Banana 標籤圖片 -->
    <div class="image-card" id="tab-banana">
        <div class="image-wrapper">
            <img src="images/img-3.1_banana.jpg" alt="Banana image" style="width:100%; border-radius:16px;">
        </div>     
    </div>

</div>

<script>
    // 標籤切換功能
    const tabs = document.querySelectorAll('.tab-btn');
    const cards = {
        self: document.getElementById('tab-self'),
        wave: document.getElementById('tab-wave'),
        banana: document.getElementById('tab-banana')
    };

    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            // 移除所有 active 狀態
            tabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 隱藏所有圖片卡
            Object.values(cards).forEach(card => card.classList.remove('active'));

            // 顯示對應圖片卡
            const tab = btn.dataset.tab;
            if (cards[tab]) cards[tab].classList.add('active');
        });
    });
</script>
</body>
</html>
